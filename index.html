    function getReadinessVisuals(pct) {
      const p = Math.max(0, Math.min(100, Number(pct) || 0));
      let h, s, l;
      if (p <= 50) {
        const t = p / 50;
        // 0%: hsl(12, 92%, 71%) розово-оранжевый -> 50%: hsl(54, 92%, 71%) лимонно-желтый
        h = 12 + (54 - 12) * t;
        s = 92;
        l = 71;
      } else {

        // 50%: hsl(54, 92%, 71%) лимонно-желтый -> 100%: hsl(134, 42%, 74%) спокойный нежно-зеленый

    function calcPriorityReadiness(items) {
      const active = items.filter(i => i.status !== "Не нужно");
      if (active.length === 0) return 100;
      const important = active.filter(i => i.importance === "Важно");
      if (important.length > 0) {
        const doneImp = important.filter(i => i.status === "Куплено" || i.status === "Сделано").length;
        return Math.round((doneImp / important.length) * 100);

    function App() {
      // Проверка гостевого режима вишлиста (#wishlist=<roomId>)

        } catch (e) {
          return [{ id: "ada_david", label: "Ада & Давид", storageKey: "iyf_data_ada_david", roomKey: "iyf_room_ada_david" }];
        }
      });

      const [currentFamilyId, setCurrentFamilyId] = useState(() => {

      });

      const currentFamilyMeta = useMemo(() => {
        return familiesIndex.find(f => f.id === currentFamilyId) || familiesIndex[0];
      }, [familiesIndex, currentFamilyId]);

      const [activeTab, setActiveTab] = useState("checklist");
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(currentFamilyMeta.storageKey);
          return saved ? JSON.parse(saved) : INITIAL_DATA;
        } catch (e) { return INITIAL_DATA; }
      });

      // Читаем #room= из URL, если открыли по ссылке-приглашению с другого устройства
      const initialHashRoom = useMemo(() => {
        const h = window.location.hash;
        return h.startsWith("#room=") ? h.replace("#room=", "").trim() : "";
      }, []);

      const [roomId, setRoomId] = useState(() => {
        if (initialHashRoom) {
          localStorage.setItem(currentFamilyMeta.roomKey, initialHashRoom);
          return initialHashRoom;
        }
        return localStorage.getItem(currentFamilyMeta.roomKey) || "";
      });

      const [syncStatus, setSyncStatus] = useState("idle"); // idle | syncing | synced | error
      const [lastSyncTime, setLastSyncTime] = useState("");
      const [joinInput, setJoinInput] = useState("");
      const [toast, setToast] = useState("");

      const dataRef = useRef(data);
      const roomIdRef = useRef(roomId);
      const famMetaRef = useRef(currentFamilyMeta);
      const lastUpdatedRef = useRef(Number(localStorage.getItem(currentFamilyMeta.storageKey + "_ts") || 0));
      const dirtyRef = useRef(false);
      const pushTimerRef = useRef(null);
      const initializedRoomPullRef = useRef(false);

      useEffect(() => { dataRef.current = data; }, [data]);
      useEffect(() => { roomIdRef.current = roomId; }, [roomId]);
      useEffect(() => { famMetaRef.current = currentFamilyMeta; }, [currentFamilyMeta]);

      const notify = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3200);
      }, []);

      const formatNow = () => {
        const d = new Date();
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      };

      // Надёжная запись в облако (создает комнату при необходимости и обновляет URL #room=...)
      const pushToCloud = useCallback(async (payload, explicitRoomId = null) => {
        const targetId = guestWishlistRoomId || explicitRoomId || roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
        setSyncStatus("syncing");
        try {
          if (!targetId) {
            const res = await fetch(CLOUD_API, {
              method: "POST",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const rawHeader = res.headers.get("X-jsonblob") || res.headers.get("x-jsonblob") || res.headers.get("Location") || res.headers.get("location");
            const newId = rawHeader ? rawHeader.split("/").pop().trim() : "";
            if (!newId) throw new Error("No room ID returned");

            roomIdRef.current = newId;
            setRoomId(newId);
            localStorage.setItem(famMetaRef.current.roomKey, newId);
            if (!guestWishlistRoomId) {
              window.history.replaceState(null, "", "#room=" + newId);
            }
            dirtyRef.current = false;
            setSyncStatus("synced");
            setLastSyncTime(formatNow());
            return true;
          } else {
            const res = await fetch(`${CLOUD_API}/${targetId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            dirtyRef.current = false;
            setSyncStatus("synced");
            setLastSyncTime(formatNow());
            return true;
          }
        } catch (err) {
          setSyncStatus("error");
          return false;
        }
      }, [guestWishlistRoomId]);

      // Надёжное чтение из облака (forceApply=true при входе по ссылке или ручной синхронизации)
      const pullFromCloud = useCallback(async (targetId, forceApply = false) => {
        if (!targetId) return false;
        try {
          const res = await fetch(`${CLOUD_API}/${targetId}`, {
            headers: { "Accept": "application/json" },
            cache: "no-store"
          });
          if (!res.ok) return false;
          const remote = await res.json();
          if (remote && remote.checklist && remote.profile) {
            const remoteTs = Number(remote._updatedAt || 0);
            const shouldApply = forceApply || (!dirtyRef.current && remoteTs > lastUpdatedRef.current);
            if (shouldApply) {
              lastUpdatedRef.current = remoteTs || Date.now();
              dataRef.current = remote;
              setData(remote);
              if (!guestWishlistRoomId) {
                localStorage.setItem(famMetaRef.current.storageKey, JSON.stringify(remote));
                localStorage.setItem(famMetaRef.current.storageKey + "_ts", String(lastUpdatedRef.current));
              }
            }
            setSyncStatus("synced");
            setLastSyncTime(formatNow());
            return true;
          }
        } catch (err) {
          setSyncStatus("error");
        }
        return false;
      }, [guestWishlistRoomId]);

      // Стартовая синхронизация при открытии приложения и фоновый опрос каждые 6 сек
      useEffect(() => {
        let cancelled = false;
        const startup = async () => {
          if (guestWishlistRoomId) {
            await pullFromCloud(guestWishlistRoomId, true);
            return;
          }

          const activeRoom = roomIdRef.current || localStorage.getItem(currentFamilyMeta.roomKey) || "";
          if (activeRoom) {
            window.history.replaceState(null, "", "#room=" + activeRoom);
            // Если устройство впервые открыло ссылку #room=..., принудительно загружаем данные из облака!
            const cameFromInviteLink = Boolean(initialHashRoom && !initializedRoomPullRef.current);
            initializedRoomPullRef.current = true;
            await pullFromCloud(activeRoom, cameFromInviteLink);
          } else {
            // Создаём облачную комнату для этой семьи сразу, чтобы ссылка была готова
            const now = lastUpdatedRef.current || Date.now();
            lastUpdatedRef.current = now;
            await pushToCloud({ ...dataRef.current, _updatedAt: now }, null);
          }
        };

        startup();

        const interval = setInterval(() => {
          if (cancelled) return;
          const activeId = guestWishlistRoomId || roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
          if (activeId && !dirtyRef.current) {
            pullFromCloud(activeId, false);
          }
        }, 6000);

        return () => {
          cancelled = true;
          clearInterval(interval);
        };
      }, [currentFamilyMeta, guestWishlistRoomId, initialHashRoom, pullFromCloud, pushToCloud]);

      // Мгновенное сохранение в localStorage + дебаунс-отправка в облако (700мс — не ломает при быстром вводе текста!)
      const persistData = useCallback((updater) => {
        setData(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          const now = Date.now();
          lastUpdatedRef.current = now;
          dirtyRef.current = true;
          const payload = { ...next, _updatedAt: now };
          dataRef.current = payload;

          if (!guestWishlistRoomId) {
            try {
              localStorage.setItem(famMetaRef.current.storageKey, JSON.stringify(payload));
              localStorage.setItem(famMetaRef.current.storageKey + "_ts", String(now));
            } catch (e) {}
          }

          if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
          setSyncStatus("syncing");
          pushTimerRef.current = setTimeout(() => {
            pushToCloud(dataRef.current);
          }, 700);

          return payload;
        });
      }, [guestWishlistRoomId, pushToCloud]);

      // Кнопка «Синхронизировать» (доступна на каждой вкладке в шапке) — Правка 3b
      const handleManualSync = async () => {
        if (pushTimerRef.current) {
          clearTimeout(pushTimerRef.current);
          pushTimerRef.current = null;
        }
        setSyncStatus("syncing");
        const activeId = roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);

        if (dirtyRef.current || !activeId) {
          const ok = await pushToCloud({ ...dataRef.current, _updatedAt: Date.now() }, activeId);
          notify(ok ? "Сохранено и синхронизировано с облаком" : "Не удалось подключиться к облаку (данные сохранены локально)");
        } else {
          // Сверяемся с облаком: если там свежее — подтягиваем; иначе подтверждаем актуальность
          const ok = await pullFromCloud(activeId, false);
          if (ok) {
            await pushToCloud({ ...dataRef.current, _updatedAt: lastUpdatedRef.current || Date.now() }, activeId);
            notify("Синхронизация выполнена");
          } else {
            notify("Не удалось связаться с облаком — проверьте интернет");
          }

      const [guestNameInput, setGuestNameInput] = useState("");
      const [reservingWishId, setReservingWishId] = useState(null);

      const seasonInfo = useMemo(
        () => getSeasonInfo(data.profile.dueDate, data.profile.country, data.profile.city),
        [data.profile.dueDate, data.profile.country, data.profile.city]
      );
      const birthEstimate = useMemo(() => estimateBirthSize(data.profile), [data.profile]);

      const daysUntilDue = useMemo(() => {
        if (!data.profile.dueDate) return null;
        const diff = new Date(data.profile.dueDate) - new Date();
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
      }, [data.profile.dueDate]);

      const overallReadiness = useMemo(() => calcPriorityReadiness(data.checklist), [data.checklist]);

      const sectionReadiness = useMemo(() => {
        if (selectedSection === "Все") return null;
        return calcPriorityReadiness(data.checklist.filter(i => i.section === selectedSection));
      }, [data.checklist, selectedSection]);

      const wardrobeFirstMonthReadiness = useMemo(() => {
        const firstMonthSizes = birthEstimate.recommendedSize === "50" ? ["50", "56"] : ["56"];
        let totalNeeded = 0;
        let totalHave = 0;
        data.wardrobe.forEach(row => {
          if (row.seasonal === "cold" && (seasonInfo.code === "summer" || seasonInfo.climate === "warm")) return;
          if (row.seasonal === "warm" && seasonInfo.code === "winter" && seasonInfo.climate !== "warm") return;
          firstMonthSizes.forEach(sz => {
            const cell = row.sizes[sz];
            if (cell && cell.need > 0) {
              totalNeeded += cell.need;
              totalHave += Math.min(cell.have, cell.need);
            }
          });
        });
        return totalNeeded === 0 ? 100 : Math.round((totalHave / totalNeeded) * 100);
      }, [data.wardrobe, birthEstimate.recommendedSize, seasonInfo]);

      const filteredChecklist = useMemo(() => {
        const filtered = data.checklist.filter(item => {
          if (selectedSection !== "Все" && item.section !== selectedSection) return false;
          if (filterWho !== "Все" && (item.who || "Общее") !== filterWho) return false;
          if (filterPriority !== "Все" && (item.importance || "Важно") !== filterPriority) return false;
          if (filterStatus === "Осталось" && (item.status === "Куплено" || item.status === "Сделано" || item.status === "Не нужно")) return false;
          if (filterStatus === "Готово" && item.status !== "Куплено" && item.status !== "Сделано") return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            if (!item.name.toLowerCase().includes(q) && !(item.notes || "").toLowerCase().includes(q)) return false;
          }
          return true;
        });

        return [...filtered].sort((a, b) => {
          const aDone = (a.status === "Куплено" || a.status === "Сделано") ? 1 : 0;
          const bDone = (b.status === "Куплено" || b.status === "Сделано") ? 1 : 0;
          if (aDone !== bDone) return aDone - bDone;
          const prioOrder = { "Важно": 0, "Нужно после родов": 1, "По желанию": 2 };
          return (prioOrder[a.importance] ?? 1) - (prioOrder[b.importance] ?? 1);
        });
      }, [data.checklist, selectedSection, filterWho, filterStatus, filterPriority, searchQuery]);

      const toggleItemDone = (id) => {
        persistData(prev => ({
          ...prev,
          checklist: prev.checklist.map(item => {
            if (item.id !== id) return item;
            const isDone = item.status === "Куплено" || item.status === "Сделано";
            const nextStatus = isDone ? "В планах" : (item.section === "Документы" || item.section === "Подготовить в доме" ? "Сделано" : "Куплено");
            return { ...item, status: nextStatus };
          })
        }));
      };

      const updateChecklistItemField = (id, field, value) => {
        persistData(prev => ({
          ...prev,
          checklist: prev.checklist.map(item => item.id === id ? { ...item, [field]: value } : item)
        }));
      };

      const deleteChecklistItem = (id) => {
        persistData(prev => ({ ...prev, checklist: prev.checklist.filter(item => item.id !== id) }));
        notify("Удалено");
      };

      const handleAddChecklistItem = (e) => {
        e.preventDefault();
        if (!newItem.name.trim()) return;
        persistData(prev => ({ ...prev, checklist: [{ ...newItem, id: "c_" + Date.now() }, ...prev.checklist] }));
        setNewItem({ ...newItem, name: "", notes: "", link: "" });
        setShowAddModal(false);
        notify("Добавлено и синхронизировано");
      };

      const sendChecklistItemToWishlist = (item) => {
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map((wl, idx) => idx !== 0 ? wl : {
            ...wl,
            items: [
              ...wl.items,
              {
                id: "wi_" + Date.now(),
                name: item.name,
                price: "",
                link: item.link || "",
                status: "Свободно",
                reservedBy: "",
                notes: item.notes || "",
                sourceChecklistId: item.id
              }
            ]
          })
        }));
        notify("Отправлено в вишлист для друзей");
      };

      const updateWardrobeCount = (rowId, size, field, delta) => {
        persistData(prev => ({
          ...prev,
          wardrobe: prev.wardrobe.map(row => {
            if (row.id !== rowId) return row;
            const current = row.sizes[size] || { have: 0, need: 0 };
            return {
              ...row,
              sizes: { ...row.sizes, [size]: { ...current, [field]: Math.max(0, current[field] + delta) } }
            };
          })
        }));
      };

      const renameWardrobeCategory = (rowId, newName) => {
        persistData(prev => ({
          ...prev,
          wardrobe: prev.wardrobe.map(row => row.id === rowId ? { ...row, category: newName } : row)
        }));
      };

      const handleAddWardrobeCategory = (e) => {
        e.preventDefault();
        if (!newWardrobeName.trim()) return;
        const defaultNeed = newWardrobeSeason === "all" ? 3 : 1;
        const newRow = {
          id: "w_" + Date.now(),
          category: newWardrobeName.trim(),
          seasonal: newWardrobeSeason,
          sizes: Object.fromEntries(SIZES.map(sz => [sz, { have: 0, need: defaultNeed }]))
        };
        persistData(prev => ({ ...prev, wardrobe: [...prev.wardrobe, newRow] }));
        setNewWardrobeName("");
        setShowAddWardrobeModal(false);
        notify("Категория добавлена");
      };

      const { nearShortages, futureShortages } = useMemo(() => {
        const near = [];
        const future = [];
        data.wardrobe.forEach(row => {
          SIZES.forEach(sz => {
            const meta = getSizeSeasonMeta(data.profile.dueDate, sz, data.profile.country, data.profile.city);
            if (row.seasonal === "cold" && (meta.code === "summer" || meta.climate === "warm")) return;
            if (row.seasonal === "warm" && meta.code === "winter" && meta.climate !== "warm") return;

            const cell = row.sizes[sz];
            if (cell && cell.need > cell.have) {
              const entry = {
                id: `${row.id}_${sz}`,
                rowId: row.id,
                category: row.category,
                size: sz,
                missing: cell.need - cell.have,
                season: meta.label
              };
              if (meta.isDistantFuture) future.push(entry);
              else near.push(entry);
            }
          });
        });
        return { nearShortages: near, futureShortages: future };
      }, [data.wardrobe, data.profile.dueDate, data.profile.country, data.profile.city]);

      const sendShortageToWishlist = (item) => {
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map((wl, idx) => idx !== 0 ? wl : {
            ...wl,
            items: [...wl.items, {
              id: "wi_" + Date.now() + Math.random(),
              name: `${item.category} — р. ${item.size} (${item.missing} шт.)`,
              price: "",
              link: "",
              status: "Свободно",
              reservedBy: "",
              notes: `Сезон: ${item.season}`,
              sourceWardrobe: { rowId: item.rowId, size: item.size }
            }]
          })
        }));
        notify(`Добавлено в вишлист: ${item.category}`);
      };

      const activeWishlist = useMemo(() => data.wishlists.find(w => w.id === activeWishlistId) || data.wishlists[0], [data.wishlists, activeWishlistId]);

      const addWishlistItem = (e) => {
        e.preventDefault();
        if (!newWishName.trim() || !activeWishlist) return;
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map(wl => wl.id === activeWishlist.id ? {
            ...wl,
            items: [...wl.items, {
              id: "wi_" + Date.now(),
              name: newWishName.trim(),
              price: newWishPrice.trim(),
              link: "",
              status: "Свободно",
              reservedBy: "",
              notes: ""
            }]
          } : wl)
        }));
        setNewWishName("");
        setNewWishPrice("");
        notify("Подарок добавлен");
      };

      const reserveWishlistItem = (wlId, itemId, friendName) => {
        persistData(prev => {
          let targetWish = null;
          const updatedWishlists = prev.wishlists.map(wl => {
            if (wl.id !== wlId) return wl;
            return {
              ...wl,
              items: wl.items.map(it => {
                if (it.id !== itemId) return it;
                targetWish = it;
                return { ...it, status: "Забронировано", reservedBy: friendName || "Друг семьи" };
              })
            };
          });

          let updatedChecklist = prev.checklist;
          if (targetWish && targetWish.sourceChecklistId) {
            updatedChecklist = prev.checklist.map(c =>
              c.id === targetWish.sourceChecklistId ? { ...c, status: "Куплено" } : c
            );
          }

          let updatedWardrobe = prev.wardrobe;
          if (targetWish && targetWish.sourceWardrobe) {
            const { rowId, size } = targetWish.sourceWardrobe;
            updatedWardrobe = prev.wardrobe.map(row => {
              if (row.id !== rowId) return row;
              const cur = row.sizes[size] || { have: 0, need: 1 };
              return { ...row, sizes: { ...row.sizes, [size]: { ...cur, have: cur.have + 1 } } };
            });
          }

          return { ...prev, wishlists: updatedWishlists, checklist: updatedChecklist, wardrobe: updatedWardrobe };
        });
        setReservingWishId(null);
        setGuestNameInput("");
        notify("Подарок забронирован!");
      };

      const deleteWishlistItemOwner = (wlId, item) => {
        persistData(prev => {
          const updatedWishlists = prev.wishlists.map(wl =>
            wl.id === wlId ? { ...wl, items: wl.items.filter(it => it.id !== item.id) } : wl
          );

          let updatedChecklist = prev.checklist;
          if (item.sourceChecklistId) {
            updatedChecklist = prev.checklist.map(c =>
              c.id === item.sourceChecklistId ? { ...c, status: "В планах" } : c
            );
          }

          let updatedWardrobe = prev.wardrobe;
          if (item.sourceWardrobe && item.status !== "Свободно") {
            const { rowId, size } = item.sourceWardrobe;
            updatedWardrobe = prev.wardrobe.map(row => {
              if (row.id !== rowId) return row;
              const cur = row.sizes[size] || { have: 0, need: 1 };
              return { ...row, sizes: { ...row.sizes, [size]: { ...cur, have: Math.max(0, cur.have - 1) } } };
            });
          }

          return { ...prev, wishlists: updatedWishlists, checklist: updatedChecklist, wardrobe: updatedWardrobe };
        });
        notify("Удалено и возвращено в список покупок");
      };

      const shareUrlNativeOrCopy = async (url, title, copyMsg) => {
        if (navigator.share) {
          try {
            await navigator.share({ title, url });
            return;
          } catch (e) {}
        }
        try {
          await navigator.clipboard.writeText(url);
          notify(copyMsg);
        } catch (e) {
          notify("Ссылка: " + url);
        }
      };

      const shareFamilyLink = async () => {
        let activeId = roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
        if (!activeId) {
          await pushToCloud({ ...dataRef.current, _updatedAt: Date.now() }, null);
          activeId = roomIdRef.current;
        }
        const baseUrl = window.location.href.split("#")[0];
        const link = activeId ? `${baseUrl}#room=${activeId}` : baseUrl;
        shareUrlNativeOrCopy(
          link,
          `Is this your first? — ${data.profile.momName} & ${data.profile.partnerName}`,
          "Ссылка скопирована! Откройте её 1 раз на телефоне, чтобы связать iPad и iPhone."
        );
      };

      const shareGuestWishlistLink = async () => {
        let activeId = roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
        if (!activeId) {
          await pushToCloud({ ...dataRef.current, _updatedAt: Date.now() }, null);
          activeId = roomIdRef.current;
        }
        const baseUrl = window.location.href.split("#")[0];
        const link = activeId ? `${baseUrl}#wishlist=${activeId}` : baseUrl;
        shareUrlNativeOrCopy(
          link,
          `Вишлист для ${data.profile.babyName}`,
          "Ссылка на вишлист для друзей скопирована!"
        );
      };

      const connectToRoom = async () => {
        const cleanId = joinInput.includes("#room=") ? joinInput.split("#room=")[1].trim() : joinInput.trim();
        if (!cleanId) return;
        localStorage.setItem(famMetaRef.current.roomKey, cleanId);
        roomIdRef.current = cleanId;
        setRoomId(cleanId);
        window.history.replaceState(null, "", "#room=" + cleanId);
        dirtyRef.current = false;
        const ok = await pullFromCloud(cleanId, true);
        setJoinInput("");
        notify(ok ? "Устройства связаны! Данные загружены." : "Не удалось найти комнату — проверьте ссылку.");
      };

      // ========================================================================
      // ГОСТЕВОЙ ВИШЛИСТ ДЛЯ ДРУЗЕЙ (без доступа к остальному приложению)
      // ========================================================================
      if (guestWishlistRoomId) {
        return (
          <div className="app-shell max-w-xl mx-auto px-4 py-8">
            {toast && (
              <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-[#20242A] text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg">
                {toast}
              </div>
            )}

            <div className="grad-pink rounded-[28px] p-6 mb-6 border border-white/80 shadow-xs">
              <div className="text-xs font-medium text-[#666C78] mb-1">Is this your first? • Вишлист</div>
              <h1 className="text-2xl font-semibold tracking-tight">Подарки для {data.profile.babyName}</h1>
              <p className="text-xs text-[#5A606B] mt-1">
                {data.profile.momName} & {data.profile.partnerName} • Забронируйте подарок, чтобы другие друзья знали, что он уже выбран.
              </p>
            </div>

            <div className="space-y-4">
              {data.wishlists.map(wl => (
                <div key={wl.id} className="space-y-2.5">
                  <h2 className="text-sm font-semibold px-1 text-[#5A606B]">{wl.title}</h2>
                  {wl.items.map(it => {
                    const isFree = it.status === "Свободно";
                    return (
                      <div key={it.id} className="surface-soft rounded-[24px] p-4">
                        <div className="flex items-start justify-between gap-3">
                          <div>
                            <div className="text-sm font-medium">{it.name}</div>
                            {it.price && <div className="text-xs text-[#666C78] font-medium mt-0.5">{it.price}</div>}
                            {it.notes && <div className="text-xs text-[#666C78] mt-1">{it.notes}</div>}
                            {it.link && it.link.startsWith("http") && (
                              <a href={it.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-xs underline mt-1.5">
                                <Icon name="link" className="w-3.5 h-3.5" />
                                <span>Открыть в магазине</span>
                              </a>
                            )}
                          </div>

                          {isFree ? (
                            <button
                              onClick={() => setReservingWishId(it.id)}
                              className="px-4 py-2 rounded-full accent-white text-xs font-semibold shrink-0 transition"
                            >
                              Забронировать
                            </button>
                          ) : (
                            <span className="px-3 py-1.5 rounded-full bg-[#E4E7EC] text-[#5A606B] text-xs font-medium shrink-0">
                              {it.status} {it.reservedBy ? `(${it.reservedBy})` : ""}
                            </span>
                          )}
                        </div>

                        {reservingWishId === it.id && (
                          <div className="mt-3 pt-3 border-t border-[#E6E8EC] flex gap-2">
                            <input
                              type="text"
                              value={guestNameInput}
                              onChange={(e) => setGuestNameInput(e.target.value)}
                              placeholder="Ваше имя (необязательно)..."
                              className="uniform-input flex-1"
                            />
                            <button
                              onClick={() => reserveWishlistItem(wl.id, it.id, guestNameInput)}
                              className="px-4 h-[42px] accent-white rounded-2xl text-xs font-semibold shrink-0"
                            >
                              ОК
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        );
      }

      // ========================================================================
      // ОСНОВНОЕ ПРИЛОЖЕНИЕ ДЛЯ СЕМЬИ
      // ========================================================================
      const syncDotColor =
        syncStatus === "synced" ? "#8FD19E" :
        syncStatus === "syncing" ? "#F7E57A" :
        syncStatus === "error" ? "#F59A84" : "#C5C9D1";

      return (
        <div className="app-shell max-w-2xl mx-auto px-4 pt-5 pb-28">
          {toast && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-[#20242A] text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg text-center max-w-[90%]">
              {toast}
            </div>
          )}

          {/* Шапка: логотип, название, кнопки «Синхронизировать» (на каждой вкладке) и «Поделиться» */}
          <header className="mb-5">
            <div className="flex items-center justify-between gap-2 mb-4">
              <div className="flex items-center gap-2.5 min-w-0">
                <div className="w-8 h-8 rounded-full accent-white flex items-center justify-center shrink-0">
                  <Icon name="dots" className="w-5 h-5 text-[#20242A]" />
                </div>
                <div className="min-w-0">
                  <div className="text-sm font-semibold tracking-tight truncate">Is this your first?</div>
                  <div className="text-[11px] text-[#666C78] truncate">
                    {data.profile.momName} & {data.profile.partnerName} • {data.profile.city}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                {/* Кнопка «Синхронизировать» всегда под рукой на каждой вкладке (Правка 3b) */}
                <button
                  onClick={handleManualSync}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-full accent-white text-[11px] font-medium transition"
                  title={lastSyncTime ? `Последняя синхронизация: ${lastSyncTime}` : "Синхронизировать с облаком"}
                >
                  <span style={{ backgroundColor: syncDotColor }} className={`w-2 h-2 rounded-full ${syncStatus === "syncing" ? "animate-pulse" : ""}`} />
                  <Icon name="sync" className={`w-3.5 h-3.5 text-[#525864] ${syncStatus === "syncing" ? "animate-spin" : ""}`} />
                  <span className="hidden sm:inline">Синхронизировать</span>
                </button>

                {/* Кнопка «Поделиться» (белая акцентная) */}
                <button
                  onClick={shareFamilyLink}
                  className="flex items-center gap-1.5 px-3 py-2 rounded-full accent-white text-[11px] font-medium transition"
                >
                  <span>Поделиться</span>
                  <Icon name="share" className="w-3.5 h-3.5 text-[#525864]" />
                </button>
              </div>
            </div>

            {/* Заголовок + динамические кружочки готовности (Правка 3) */}
            <div className="flex items-center justify-between gap-2">
              <div className="min-w-0">
                <p className="text-xs text-[#666C78] mb-0.5 truncate">
                  {seasonInfo.name} {daysUntilDue > 0 ? `• ~${daysUntilDue} дн. до ПДР` : ""}
                </p>
                <h1 className="text-2xl sm:text-3xl font-semibold tracking-tight truncate">
                  {activeTab === "checklist" && (selectedSection === "Все" ? "Все списки" : selectedSection)}
                  {activeTab === "wardrobe" && "Гардероб"}
                  {activeTab === "wishlists" && "Вишлист"}
                  {activeTab === "profile" && "Семья"}
                </h1>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                {activeTab === "checklist" && sectionReadiness !== null && (
                  <ReadinessPill label="Раздел" pct={sectionReadiness} />
                )}
                {activeTab === "wardrobe" && (
                  <ReadinessPill label="1-й мес." pct={wardrobeFirstMonthReadiness} />
                )}
                <ReadinessPill label="Общая" pct={overallReadiness} />
              </div>
            </div>
          </header>

          {/* ==================================================================== */}
          {/* 1. ВКЛАДКА СПИСКИ                                                    */}
          {/* ==================================================================== */}
          {activeTab === "checklist" && (
            <div className="space-y-4">
              {/* Правка 1 & 2: Все плашки видны сразу, ТОЛЬКО заголовки (без иконок и комментариев), чистые нежные градиенты */}
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                {SECTION_TILES.map(tile => {
                  const isSelected = selectedSection === tile.id;
                  return (
                    <button
                      key={tile.id}
                      onClick={() => setSelectedSection(tile.id)}
                      className={`${tile.grad} rounded-[22px] px-4 py-4 text-left transition border ${
                        isSelected
                          ? "border-[#20242A]/35 shadow-sm scale-[0.99]"
                          : "border-white/80 opacity-92 hover:opacity-100"
                      }`}
                    >
                      <div className="text-[14px] font-semibold tracking-tight leading-snug">
                        {tile.label}
                      </div>
                    </button>
                  );
                })}
              </div>

              {/* Поиск + белая акцентная кнопка "+" */}
              <div className="flex gap-2">
                <div className="relative flex-1">
                  <Icon name="search" className="w-4 h-4 text-[#7A808C] absolute left-3.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Поиск по вещам и документам..."
                    className="w-full h-[44px] pl-10 pr-4 bg-[#E9EBEF] rounded-2xl text-xs placeholder-[#7A808C] focus:outline-none focus:bg-white transition"
                  />
                </div>
                <button
                  onClick={() => setShowAddModal(true)}
                  className="w-[44px] h-[44px] rounded-2xl accent-white flex items-center justify-center shrink-0 transition"
                >
                  <Icon name="plus" className="w-5 h-5" />
                </button>
              </div>

              {/* Фильтры на светло-серых треках с белым активным акцентом */}
              <div className="space-y-2 text-[11px]">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <div className="flex gap-1 bg-[#E7E9EE] p-1 rounded-full">
                    {["Все", "Осталось", "Готово"].map(st => (
                      <button
                        key={st}

                  </span>
                </div>
                <p className="text-xs text-[#666C78] leading-relaxed">
                  Чтобы iPad и iPhone всегда видели одни и те же правки, нажмите «Поделиться» на первом устройстве и <b>один раз откройте эту ссылку на втором</b> (или вставьте код комнаты ниже).
                </p>

                {roomId && (
                  <div className="flex items-center justify-between gap-2 px-3 py-2 rounded-2xl bg-[#ECEEF2] text-[11px]">
                    <span className="text-[#666C78] truncate">Код семьи: <b className="text-[#20242A]">{roomId}</b></span>
                    <button
                      onClick={() => { navigator.clipboard?.writeText(roomId); notify("Код семьи скопирован"); }}
                      className="px-2.5 py-1 rounded-full accent-white font-medium shrink-0"
                    >
                      Копировать
                    </button>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={handleManualSync}
                    className="py-2.5 rounded-2xl accent-white text-xs font-semibold flex items-center justify-center gap-1.5"
                  >
                    <Icon name="sync" className="w-3.5 h-3.5" />
                    <span>Синхронизировать</span>
                  </button>
                  <button
                    onClick={shareFamilyLink}
                    className="py-2.5 rounded-2xl accent-white text-xs font-semibold flex items-center justify-center gap-1.5"
                  >
                    <Icon name="share" className="w-3.5 h-3.5" />
                    <span>Поделиться</span>
                  </button>
                </div>

                <div className="flex gap-2 pt-1">
                  <input
                    type="text"
                    value={joinInput}
                    onChange={(e) => setJoinInput(e.target.value)}
                    placeholder="Вставьте ссылку или код с другого устройства..."
                    className="uniform-input flex-1"
                  />
                  <button onClick={connectToRoom} className="px-4 h-[42px] accent-white rounded-2xl text-xs font-semibold shrink-0">
                    Войти
                  </button>
                </div>
              </div>

              {/* Анкета семьи — Правка 4: все поля строго одинакового размера (uniform-input) */}
              <div className="surface-soft rounded-[26px] p-4 space-y-3 text-xs">
                <div className="text-sm font-semibold">Данные семьи и ПДР</div>
                <div className="grid grid-cols-2 gap-2.5">
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Мама</label>
                    <input
                      type="text"
                      value={data.profile.momName}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, momName: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Папа</label>
                    <input
                      type="text"
                      value={data.profile.partnerName}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, partnerName: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Имя малыша</label>
                    <input
                      type="text"
                      value={data.profile.babyName}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, babyName: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">ПДР</label>
                    <input
                      type="date"
                      value={data.profile.dueDate}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, dueDate: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Страна</label>
                    <input
                      type="text"
                      value={data.profile.country}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, country: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Город</label>
                    <input
                      type="text"
                      value={data.profile.city}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, city: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛКА ДОБАВЛЕНИЯ В СПИСОК */}
          {showAddModal && (
            <div className="fixed inset-0 bg-black/20 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={handleAddChecklistItem} className="bg-[#F2F3F6] w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl border border-white">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold">Новая задача / покупка</h3>
                  <button type="button" onClick={() => setShowAddModal(false)} className="w-8 h-8 rounded-full accent-white flex items-center justify-center">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <select
                  value={newItem.section}
                  onChange={(e) => setNewItem({ ...newItem, section: e.target.value })}
                  className="uniform-input"
                >
                  {SECTION_TILES.filter(s => s.id !== "Все").map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
                <input
                  type="text"
                  required
                  value={newItem.name}
                  onChange={(e) => setNewItem({ ...newItem, name: e.target.value })}
                  placeholder="Название..."
                  className="uniform-input"
                />
                <div className="grid grid-cols-2 gap-2">
                  <select
                    value={newItem.importance}
                    onChange={(e) => setNewItem({ ...newItem, importance: e.target.value })}
                    className="uniform-input"
                  >
                    {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                  <input
                    type="text"
                    value={newItem.who}
                    onChange={(e) => setNewItem({ ...newItem, who: e.target.value })}
                    placeholder="Кто"
                    className="uniform-input"
                  />
                </div>
                <input
                  type="text"
                  value={newItem.notes}
                  onChange={(e) => setNewItem({ ...newItem, notes: e.target.value })}
                  placeholder="Комментарий..."
                  className="uniform-input"
                />
                <button type="submit" className="w-full py-3 accent-white rounded-2xl text-xs font-semibold">
                  Сохранить
                </button>
              </form>
            </div>
          )}

          {/* МОДАЛКА ДОБАВЛЕНИЯ КАТЕГОРИИ В ГАРДЕРОБ */}
          {showAddWardrobeModal && (
            <div className="fixed inset-0 bg-black/20 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={handleAddWardrobeCategory} className="bg-[#F2F3F6] w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl border border-white">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold">Новая категория одежды</h3>
                  <button type="button" onClick={() => setShowAddWardrobeModal(false)} className="w-8 h-8 rounded-full accent-white flex items-center justify-center">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <input
                  type="text"
                  required
                  value={newWardrobeName}
                  onChange={(e) => setNewWardrobeName(e.target.value)}
                  placeholder="Например: Песочники / Муслиновые боди..."
                  className="uniform-input"
                />
                <select
                  value={newWardrobeSeason}
                  onChange={(e) => setNewWardrobeSeason(e.target.value)}
                  className="uniform-input"
                >
                  <option value="all">Всесезонная одежда (нужна круглый год)</option>
                  <option value="cold">Только для холодного сезона (не нужна летом)</option>
                  <option value="warm">Только для тёплого сезона (не нужна зимой)</option>
                </select>
                <button type="submit" className="w-full py-3 accent-white rounded-2xl text-xs font-semibold">
                  Добавить в таблицу
                </button>
              </form>
            </div>
          )}

          {/* МОДАЛКА «НАЧАТЬ С НУЛЯ (ТЕСТ)» — Правка 5: 5 вопросов (имя мамы, ПДР, страна, город, рост мамы) */}
          {showNewFamilyModal && (
            <div className="fixed inset-0 bg-black/20 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={createFreshFamilyAccount} className="bg-[#F2F3F6] w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl border border-white">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold">Начать с нуля (тест)</h3>
                  <button type="button" onClick={() => setShowNewFamilyModal(false)} className="w-8 h-8 rounded-full accent-white flex items-center justify-center">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <p className="text-xs text-[#666C78] leading-relaxed">
                  Ответьте на 5 вопросов — приложение определит сезон и климат, соберёт стартовую базу документов, гардероба и вещей на выписку.
                </p>

                <div className="grid grid-cols-2 gap-2.5 text-xs">
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Имя мамы *</label>
                    <input
                      type="text"
                      required
                      value={newFamForm.momName}
                      onChange={(e) => setNewFamForm({ ...newFamForm, momName: e.target.value })}
                      placeholder="Например: Анна"
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">ПДР *</label>
                    <input
                      type="date"
                      required
                      value={newFamForm.dueDate}
                      onChange={(e) => setNewFamForm({ ...newFamForm, dueDate: e.target.value })}
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Страна *</label>
                    <input
                      type="text"
                      required
                      value={newFamForm.country}
                      onChange={(e) => setNewFamForm({ ...newFamForm, country: e.target.value })}
                      placeholder="Швейцария / Испания..."
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Город *</label>
                    <input
                      type="text"
                      required
                      value={newFamForm.city}
                      onChange={(e) => setNewFamForm({ ...newFamForm, city: e.target.value })}
                      placeholder="Цюрих / Барселона..."
                      className="uniform-input"
                    />
                  </div>
                  <div className="col-span-2 min-w-0">
                    <label className="block text-[11px] text-[#666C78] mb-1">Рост мамы (см) *</label>
                    <input
                      type="number"
                      required
                      min="140"
                      max="205"
                      value={newFamForm.momHeightCm}
                      onChange={(e) => setNewFamForm({ ...newFamForm, momHeightCm: e.target.value })}
                      placeholder="168"
                      className="uniform-input"
                    />
                  </div>
                </div>

                <button type="submit" className="w-full py-3 accent-white rounded-2xl text-xs font-semibold">
                  Сформировать персональную базу
                </button>
              </form>
            </div>
          )}

          {/* Нижняя навигация: светло-серый трек, активная иконка — чисто белая (Правка 1) */}
          <nav className="fixed bottom-4 inset-x-4 max-w-md mx-auto pill-track rounded-full p-1.5 z-40">
            <div className="grid grid-cols-4 gap-1">
              {[
                { id: "checklist", label: "Списки", icon: "checkCircle" },
                { id: "wardrobe", label: "Гардероб", icon: "shirt" },
                { id: "wishlists", label: "Вишлист", icon: "gift" },
                { id: "profile", label: "Семья", icon: "user" }
              ].map(tab => {
                const active = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center py-2 rounded-full transition ${
                      active ? "accent-white font-semibold" : "text-[#6D7380]"
                    }`}
                  >
                    <Icon name={tab.icon} className="w-4 h-4 mb-0.5" />
                    <span className="text-[10px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
