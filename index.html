      if (month >= 3 && month <= 5) return { name: "Весна", code: "spring" };
      if (month >= 6 && month <= 8) return { name: "Лето", code: "summer" };
      return { name: "Осень", code: "autumn" };
    }

    function getSizeSeasonMeta(dueDateStr, size) {
      const offsets = { "50": 0, "56": 0, "62": 2, "68": 4, "74": 7, "80": 10 };
      const monthsAhead = offsets[size] || 0;
      const d = dueDateStr ? new Date(dueDateStr) : new Date("2026-12-15");
      d.setMonth(d.getMonth() + monthsAhead);
      const m = d.getMonth() + 1;
      let label = "Осень";
      let code = "autumn";
      if (m === 12 || m === 1 || m === 2) { label = "Зима"; code = "winter"; }
      else if (m >= 3 && m <= 5) { label = "Весна"; code = "spring"; }
      else if (m >= 6 && m <= 8) { label = "Лето"; code = "summer"; }

      // Дальше чем на 2 сезона (например > 6 мес от ПДР — размеры 74 и 80 для зимнего ПДР это лето/осень)
      const isDistantFuture = monthsAhead >= 6;
      return { label, code, isDistantFuture, monthsAhead };
    }

    // Расчет предполагаемого веса при рождении и размера (пункт 8)
    function estimateBirthSize(profile) {
      const week = Number(profile.ultrasoundWeek) || 32;
      const weight = Number(profile.ultrasoundWeightGrams) || 1950;
      const momH = Number(profile.momHeightCm) || 168;
      const dadH = Number(profile.dadHeightCm) || 182;
      const gender = profile.babyGender || "unknown";

      // Прибавка плода: ~200 г/нед с 30 по 36 нед, ~180 г/нед с 36 по 40 нед
      let weeksLeft = Math.max(0, 40 - week);
      let estBirthWeight = weight + weeksLeft * 195;

      // Коррекция по росту родителей и полу
      const midParentHeight = (momH + dadH) / 2;
      const heightFactor = (midParentHeight - 172) * 12; // +-12г на каждый см отличия от среднего
      const genderFactor = gender === "boy" ? 80 : gender === "girl" ? -70 : 0;
      estBirthWeight = Math.round(estBirthWeight + heightFactor + genderFactor);

      // Примерный рост при рождении (см)
      const estLength = Math.round(48 + (estBirthWeight - 3000) / 220 + (midParentHeight - 172) * 0.12);
      const recommendedSize = estLength <= 51 && estBirthWeight < 3200 ? "50" : estLength >= 55 || estBirthWeight > 4100 ? "62" : "56";

      return { estBirthWeight, estLength, recommendedSize };
    }

    // Умный расчет готовности с приоритетом "Важно" (пункт 7):
    // Готовность = 100%, когда выполнены все задачи "Важно" (если важных нет — по всем задачам).
    function calcPriorityReadiness(items) {
      const active = items.filter(i => i.status !== "Не нужно");
      if (active.length === 0) return 100;
      const important = active.filter(i => i.importance === "Важно");
      if (important.length > 0) {
        const doneImp = important.filter(i => i.status === "Куплено" || i.status === "Сделано").length;
        return Math.round((doneImp / important.length) * 100);
      }
      const doneAll = active.filter(i => i.status === "Куплено" || i.status === "Сделано").length;
      return Math.round((doneAll / active.length) * 100);
    }

    function App() {
      // Проверка режима гостя вишлиста (#wishlist=<roomId>) — пункт 9
      const [guestWishlistRoomId, setGuestWishlistRoomId] = useState(() => {
        const h = window.location.hash;
        if (h.startsWith("#wishlist=")) return h.replace("#wishlist=", "").trim();
        return "";
      });

      // Поддержка нескольких семейных аккаунтов / тестового режима с нуля (пункт 11)
      const [familiesIndex, setFamiliesIndex] = useState(() => {
        try {
          const idx = localStorage.getItem("iyf_families_v1");
          return idx ? JSON.parse(idx) : [{ id: "ada_david", label: "Ада & Давид (Основная)", storageKey: "iyf_data_ada_david", roomKey: "iyf_room_ada_david" }];
        } catch (e) {
          return [{ id: "ada_david", label: "Ада & Давид (Основная)", storageKey: "iyf_data_ada_david", roomKey: "iyf_room_ada_david" }];
        }
      });

      const [currentFamilyId, setCurrentFamilyId] = useState(() => {
        return localStorage.getItem("iyf_active_family") || "ada_david";
      });

      const currentFamilyMeta = useMemo(() => {
        return familiesIndex.find(f => f.id === currentFamilyId) || familiesIndex[0];
      }, [familiesIndex, currentFamilyId]);

      const [activeTab, setActiveTab] = useState("checklist");
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(currentFamilyMeta.storageKey);
          return saved ? JSON.parse(saved) : INITIAL_DATA;
        } catch (e) { return INITIAL_DATA; }
      });

      // Переключение между семьями / аккаунтами (пункт 11)
      const switchFamilyAccount = (famId) => {
        const target = familiesIndex.find(f => f.id === famId);
        if (!target) return;
        setCurrentFamilyId(famId);
        localStorage.setItem("iyf_active_family", famId);
        try {
          const raw = localStorage.getItem(target.storageKey);
          setData(raw ? JSON.parse(raw) : INITIAL_DATA);
        } catch (e) {
          setData(INITIAL_DATA);
        }
        const savedRoom = localStorage.getItem(target.roomKey) || "";
        setRoomId(savedRoom);
        notify(`Открыт профиль: ${target.label}`);
      };

      // Создание новой семьи с нуля в тестовом режиме (пункт 11)
      const [showNewFamilyModal, setShowNewFamilyModal] = useState(false);
      const [newFamForm, setNewFamForm] = useState({ momName: "", partnerName: "", babyName: "", dueDate: "2027-03-15", country: "Швейцария", city: "Цюрих" });

      const createFreshFamilyAccount = (e) => {
        e.preventDefault();
        if (!newFamForm.momName.trim()) return;
        const newId = "fam_" + Date.now();
        const label = `${newFamForm.momName}${newFamForm.partnerName ? " & " + newFamForm.partnerName : ""}`;
        const newMeta = { id: newId, label, storageKey: "iyf_data_" + newId, roomKey: "iyf_room_" + newId };

        // Базовый чистый шаблон для новой семьи с нуля (все задачи в статусе "В планах", гардероб по 0)
        const freshData = {
          profile: {
            momName: newFamForm.momName.trim(),
            partnerName: newFamForm.partnerName.trim() || "Партнер",
            babyName: newFamForm.babyName.trim() || "Малыш",

            country: newFamForm.country.trim() || "Швейцария",

          },

      const [roomId, setRoomId] = useState(() => {

          localStorage.setItem(currentFamilyMeta.roomKey, id);
          return id;
        }
        return localStorage.getItem(currentFamilyMeta.roomKey) || "";
      });

      const [syncStatus, setSyncStatus] = useState("local");
      const [joinInput, setJoinInput] = useState("");
      const isRemoteUpdate = useRef(false);
      const lastUpdatedRef = useRef(Number(localStorage.getItem(currentFamilyMeta.storageKey + "_ts") || 0));

      // Инициализация и фоновая синхронизация (пункт 2: гарантированное сохранение и приоритет свежих локальных правок)
      useEffect(() => {
        const targetRoom = guestWishlistRoomId || roomId;

        const initCloud = async () => {
          if (guestWishlistRoomId) {
            await fetchFromCloud(guestWishlistRoomId, true);
            return;
          }
          if (!roomId) {
            try {
              setSyncStatus("syncing");
              const now = Date.now();
              const res = await fetch(CLOUD_API, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify({ ...data, _updatedAt: now })
              });
              const loc = res.headers.get("Location") || res.headers.get("X-jsonblob");
              if (loc) {
                const newId = loc.split("/").pop();
                setRoomId(newId);
                localStorage.setItem(currentFamilyMeta.roomKey, newId);
                lastUpdatedRef.current = now;
                localStorage.setItem(currentFamilyMeta.storageKey + "_ts", String(now));
                setSyncStatus("synced");
              }
            } catch (e) {
              setSyncStatus("local");
            }
          } else {
            await fetchFromCloud(roomId, false);
          }
        };

        initCloud();

        const interval = setInterval(() => {
          const activeId = guestWishlistRoomId || localStorage.getItem(currentFamilyMeta.roomKey);
          if (activeId) fetchFromCloud(activeId, Boolean(guestWishlistRoomId));
        }, 4500);

        return () => clearInterval(interval);
      }, [roomId, guestWishlistRoomId, currentFamilyMeta]);

      const fetchFromCloud = async (id, isGuest) => {
        try {
          const res = await fetch(`${CLOUD_API}/${id}`, { headers: { "Accept": "application/json" } });
          if (!res.ok) return;
          const remoteData = await res.json();
          if (remoteData && remoteData.checklist) {
            const remoteTs = Number(remoteData._updatedAt || 0);
            // Принимаем облачные данные ТОЛЬКО если они новее наших локальных изменений (исправляет баг перезаписи ПДР/имени!)
            if (isGuest || remoteTs > lastUpdatedRef.current) {
              isRemoteUpdate.current = true;
              lastUpdatedRef.current = remoteTs;
              setData(remoteData);
              if (!isGuest) {
                localStorage.setItem(currentFamilyMeta.storageKey, JSON.stringify(remoteData));
                localStorage.setItem(currentFamilyMeta.storageKey + "_ts", String(remoteTs));
              }
              setSyncStatus("synced");
            }
          }
        } catch (e) {}
      };

      // Мгновенное сохранение локально и отправка в облако при любом редактировании
      const persistData = (updater) => {
        setData(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          const now = Date.now();
          lastUpdatedRef.current = now;
          const payload = { ...next, _updatedAt: now };

          if (!guestWishlistRoomId) {
            try {
              localStorage.setItem(currentFamilyMeta.storageKey, JSON.stringify(payload));
              localStorage.setItem(currentFamilyMeta.storageKey + "_ts", String(now));
            } catch (e) {}
          }

          const targetId = guestWishlistRoomId || localStorage.getItem(currentFamilyMeta.roomKey);
          if (targetId) {
            setSyncStatus("syncing");
            fetch(`${CLOUD_API}/${targetId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify(payload)
            })
              .then(() => setSyncStatus("synced"))
              .catch(() => setSyncStatus("error"));
          }
          return payload;
        });
      };

      // Фильтры и раскрытие карточек (пункт 3)
      const [selectedSection, setSelectedSection] = useState("Все");
      const [filterWho, setFilterWho] = useState("Все");
      const [filterStatus, setFilterStatus] = useState("Все");
      const [filterPriority, setFilterPriority] = useState("Все");
      const [searchQuery, setSearchQuery] = useState("");
      const [expandedItemId, setExpandedItemId] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);

      const [newItem, setNewItem] = useState({
        section: "Малыш: уход",
        category: "Покупки",
        name: "",
        importance: "Важно",
        status: "В планах",
        who: data.profile.momName || "Ада",
        qty: "1 шт.",
        notes: "",
        link: ""
      });

      // Гардероб: модалка добавления новой категории и редактирование названия (пункт 8)
      const [showAddWardrobeModal, setShowAddWardrobeModal] = useState(false);
      const [newWardrobeName, setNewWardrobeName] = useState("");
      const [newWardrobeSeason, setNewWardrobeSeason] = useState("all");
      const [editingWardrobeId, setEditingWardrobeId] = useState(null);

      // Вишлисты
      const [activeWishlistId, setActiveWishlistId] = useState(data.wishlists[0]?.id || "wl1");
      const [newWishName, setNewWishName] = useState("");
      const [newWishPrice, setNewWishPrice] = useState("");
      const [guestNameInput, setGuestNameInput] = useState("");
      const [reservingWishId, setReservingWishId] = useState(null);
      const [toast, setToast] = useState("");

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3200);
      };

      const seasonInfo = useMemo(() => getSeasonInfo(data.profile.dueDate), [data.profile.dueDate]);
      const birthEstimate = useMemo(() => estimateBirthSize(data.profile), [data.profile]);

      const daysUntilDue = useMemo(() => {
        if (!data.profile.dueDate) return null;
        const diff = new Date(data.profile.dueDate) - new Date();
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
      }, [data.profile.dueDate]);

      // Общая готовность (пункт 7: приоритет "Важно")
      const overallReadiness = useMemo(() => calcPriorityReadiness(data.checklist), [data.checklist]);

      // Готовность по открытому конкретному списку (пункт 7)
      const sectionReadiness = useMemo(() => {
        if (selectedSection === "Все") return null;
        const secItems = data.checklist.filter(i => i.section === selectedSection);
        return calcPriorityReadiness(secItems);
      }, [data.checklist, selectedSection]);

      // Готовность гардероба ТОЛЬКО на первый месяц (размеры 50 и 56 с учетом сезона рождения, минимум 3 шт) — пункт 8
      const wardrobeFirstMonthReadiness = useMemo(() => {
        const firstMonthSizes = birthEstimate.recommendedSize === "50" ? ["50", "56"] : ["56"];
        let totalNeeded = 0;
        let totalHave = 0;

        data.wardrobe.forEach(row => {
          // Пропускаем сезонную одежду, не подходящую под сезон рождения
          if (row.seasonal === "cold" && seasonInfo.code === "summer") return;
          if (row.seasonal === "warm" && seasonInfo.code === "winter") return;

          firstMonthSizes.forEach(sz => {
            const cell = row.sizes[sz];
            if (cell && cell.need > 0) {
              totalNeeded += cell.need;
              totalHave += Math.min(cell.have, cell.need);
            }
          });
        });

        if (totalNeeded === 0) return 100;
        return Math.round((totalHave / totalNeeded) * 100);
      }, [data.wardrobe, birthEstimate.recommendedSize, seasonInfo.code]);

      // Фильтрация и сортировка: по умолчанию невыполненные задачи всегда вверху (пункт 3)
      const filteredChecklist = useMemo(() => {
        const filtered = data.checklist.filter(item => {
          if (selectedSection !== "Все" && item.section !== selectedSection) return false;
          if (filterWho !== "Все" && (item.who || "Общее") !== filterWho) return false;
          if (filterPriority !== "Все" && (item.importance || "Важно") !== filterPriority) return false;
          if (filterStatus === "Осталось" && (item.status === "Куплено" || item.status === "Сделано" || item.status === "Не нужно")) return false;
          if (filterStatus === "Готово" && item.status !== "Куплено" && item.status !== "Сделано") return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            if (!item.name.toLowerCase().includes(q) && !(item.notes || "").toLowerCase().includes(q)) return false;
          }
          return true;
        });

        return [...filtered].sort((a, b) => {
          const aDone = (a.status === "Куплено" || a.status === "Сделано") ? 1 : 0;
          const bDone = (b.status === "Куплено" || b.status === "Сделано") ? 1 : 0;
          if (aDone !== bDone) return aDone - bDone;
          const prioOrder = { "Важно": 0, "Нужно после родов": 1, "По желанию": 2 };
          return (prioOrder[a.importance] ?? 1) - (prioOrder[b.importance] ?? 1);
        });
      }, [data.checklist, selectedSection, filterWho, filterStatus, filterPriority, searchQuery]);

      const toggleItemDone = (id) => {
        persistData(prev => ({
          ...prev,
          checklist: prev.checklist.map(item => {
            if (item.id !== id) return item;
            const isDone = item.status === "Куплено" || item.status === "Сделано";
            const nextStatus = isDone ? "В планах" : (item.section === "Документы" || item.section === "Подготовить в доме" ? "Сделано" : "Куплено");
            return { ...item, status: nextStatus };
          })
        }));
      };

      const updateChecklistItemField = (id, field, value) => {
        persistData(prev => ({
          ...prev,
          checklist: prev.checklist.map(item => item.id === id ? { ...item, [field]: value } : item)
        }));
      };

      const deleteChecklistItem = (id) => {
        persistData(prev => ({ ...prev, checklist: prev.checklist.filter(item => item.id !== id) }));
        notify("Удалено");
      };

      const handleAddChecklistItem = (e) => {
        e.preventDefault();
        if (!newItem.name.trim()) return;
        persistData(prev => ({ ...prev, checklist: [{ ...newItem, id: "c_" + Date.now() }, ...prev.checklist] }));
        setNewItem({ ...newItem, name: "", notes: "", link: "" });
        setShowAddModal(false);
        notify("Добавлено и сохранено");
      };

      // Отправка задачи из списка в вишлист (пункт 9: связываем sourceChecklistId)
      const sendChecklistItemToWishlist = (item) => {
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map((wl, idx) => idx !== 0 ? wl : {
            ...wl,
            items: [
              ...wl.items,
              {
                id: "wi_" + Date.now(),
                name: item.name,
                price: "",
                link: item.link || "",
                status: "Свободно",
                reservedBy: "",
                notes: item.notes || "",
                sourceChecklistId: item.id
              }
            ]
          })
        }));
        notify("Отправлено в вишлист! Когда друг забронирует, задача отметится выполненной.");
      };

      // Гардероб: обновление количества, названия, добавление категории
      const updateWardrobeCount = (rowId, size, field, delta) => {
        persistData(prev => ({
          ...prev,
          wardrobe: prev.wardrobe.map(row => {
            if (row.id !== rowId) return row;
            const current = row.sizes[size] || { have: 0, need: 0 };
            return {
              ...row,
              sizes: { ...row.sizes, [size]: { ...current, [field]: Math.max(0, current[field] + delta) } }
            };
          })
        }));
      };

      const renameWardrobeCategory = (rowId, newName) => {
        persistData(prev => ({
          ...prev,
          wardrobe: prev.wardrobe.map(row => row.id === rowId ? { ...row, category: newName } : row)
        }));
      };

      const handleAddWardrobeCategory = (e) => {
        e.preventDefault();
        if (!newWardrobeName.trim()) return;
        const defaultNeed = newWardrobeSeason === "all" ? 3 : 1;
        const newRow = {
          id: "w_" + Date.now(),
          category: newWardrobeName.trim(),
          seasonal: newWardrobeSeason,
          sizes: Object.fromEntries(SIZES.map(sz => [sz, { have: 0, need: defaultNeed }]))
        };
        persistData(prev => ({ ...prev, wardrobe: [...prev.wardrobe, newRow] }));
        setNewWardrobeName("");
        setShowAddWardrobeModal(false);
        notify("Категория добавлена в гардероб");
      };

      // Разделение покупок гардероба на ближайшие 2 сезона и "На далекое будущее" (пункт 8)
      const { nearShortages, futureShortages } = useMemo(() => {
        const near = [];
        const future = [];
        data.wardrobe.forEach(row => {
          SIZES.forEach(sz => {
            const meta = getSizeSeasonMeta(data.profile.dueDate, sz);
            // Если одежда не подходит по сезону (например, теплый комбез летом), квадратик и покупка не нужны
            if (row.seasonal === "cold" && meta.code === "summer") return;
            if (row.seasonal === "warm" && meta.code === "winter") return;

            const cell = row.sizes[sz];
            if (cell && cell.need > cell.have) {
              const entry = {
                id: `${row.id}_${sz}`,
                rowId: row.id,
                category: row.category,
                size: sz,
                missing: cell.need - cell.have,
                season: meta.label
              };
              if (meta.isDistantFuture) future.push(entry);
              else near.push(entry);
            }
          });
        });
        return { nearShortages: near, futureShortages: future };
      }, [data.wardrobe, data.profile.dueDate]);

      // Отправка из гардероба в вишлист (пункт 9: связываем sourceWardrobe)
      const sendShortageToWishlist = (item) => {
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map((wl, idx) => idx !== 0 ? wl : {
            ...wl,
            items: [...wl.items, {
              id: "wi_" + Date.now() + Math.random(),
              name: `${item.category} — р. ${item.size} (${item.missing} шт.)`,
              price: "",
              link: "",
              status: "Свободно",
              reservedBy: "",
              notes: `Сезон: ${item.season}`,
              sourceWardrobe: { rowId: item.rowId, size: item.size }
            }]
          })
        }));
        notify(`Добавлено в вишлист: ${item.category}`);
      };

      const activeWishlist = useMemo(() => data.wishlists.find(w => w.id === activeWishlistId) || data.wishlists[0], [data.wishlists, activeWishlistId]);

      const addWishlistItem = (e) => {
        e.preventDefault();
        if (!newWishName.trim() || !activeWishlist) return;
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map(wl => wl.id === activeWishlist.id ? {
            ...wl,
            items: [...wl.items, {
              id: "wi_" + Date.now(),
              name: newWishName.trim(),
              price: newWishPrice.trim(),
              link: "",
              status: "Свободно",
              reservedBy: "",
              notes: ""
            }]
          } : wl)
        }));
        setNewWishName("");
        setNewWishPrice("");
        notify("Подарок добавлен в вишлист");
      };

      // Бронирование подарка (работает и для владельцев, и для друзей по гостевой ссылке!) — пункт 9
      const reserveWishlistItem = (wlId, itemId, friendName) => {
        persistData(prev => {
          let targetWish = null;
          const updatedWishlists = prev.wishlists.map(wl => {
            if (wl.id !== wlId) return wl;
            return {
              ...wl,
              items: wl.items.map(it => {
                if (it.id !== itemId) return it;
                targetWish = it;
                return { ...it, status: "Забронировано", reservedBy: friendName || "Друг семьи" };
              })
            };
          });

          // Если вещь была отправлена из "Списков" -> ставим "Сделано" / "Куплено"
          let updatedChecklist = prev.checklist;
          if (targetWish && targetWish.sourceChecklistId) {
            updatedChecklist = prev.checklist.map(c =>
              c.id === targetWish.sourceChecklistId ? { ...c, status: "Куплено" } : c
            );
          }

          // Если вещь была отправлена из "Гардероба" -> прибавляем +1 к наличию
          let updatedWardrobe = prev.wardrobe;
          if (targetWish && targetWish.sourceWardrobe) {
            const { rowId, size } = targetWish.sourceWardrobe;
            updatedWardrobe = prev.wardrobe.map(row => {
              if (row.id !== rowId) return row;
              const cur = row.sizes[size] || { have: 0, need: 1 };
              return { ...row, sizes: { ...row.sizes, [size]: { ...cur, have: cur.have + 1 } } };
            });
          }

          return { ...prev, wishlists: updatedWishlists, checklist: updatedChecklist, wardrobe: updatedWardrobe };
        });
        setReservingWishId(null);
        setGuestNameInput("");
        notify("Подарок забронирован! Статус обновлён везде.");
      };

      // Удаление из вишлиста (только для владельцев семьи) — пункт 9:
      // При удалении возвращает вещь обратно в списки ("В планах") или -1 в гардероб!
      const deleteWishlistItemOwner = (wlId, item) => {
        persistData(prev => {
          const updatedWishlists = prev.wishlists.map(wl =>
            wl.id === wlId ? { ...wl, items: wl.items.filter(it => it.id !== item.id) } : wl
          );

          let updatedChecklist = prev.checklist;
          if (item.sourceChecklistId) {
            updatedChecklist = prev.checklist.map(c =>
              c.id === item.sourceChecklistId ? { ...c, status: "В планах" } : c
            );
          }

          let updatedWardrobe = prev.wardrobe;
          if (item.sourceWardrobe && item.status !== "Свободно") {
            const { rowId, size } = item.sourceWardrobe;
            updatedWardrobe = prev.wardrobe.map(row => {
              if (row.id !== rowId) return row;
              const cur = row.sizes[size] || { have: 0, need: 1 };
              return { ...row, sizes: { ...row.sizes, [size]: { ...cur, have: Math.max(0, cur.have - 1) } } };
            });
          }

          return { ...prev, wishlists: updatedWishlists, checklist: updatedChecklist, wardrobe: updatedWardrobe };
        });
        notify("Удалено из вишлиста и возвращено в список покупок");
      };

      // Кнопка "Поделиться" (пункт 6 и пункт 9)
      const shareFamilyLink = () => {
        const baseUrl = window.location.href.split("#")[0];
        const link = roomId ? `${baseUrl}#room=${roomId}` : baseUrl;
        navigator.clipboard?.writeText(link);
        notify("Ссылка для семьи скопирована! Отправьте её партнёру.");
      };

      const shareGuestWishlistLink = () => {
        const baseUrl = window.location.href.split("#")[0];
        const link = roomId ? `${baseUrl}#wishlist=${roomId}` : baseUrl;
        navigator.clipboard?.writeText(link);
        notify("Гостевая ссылка на вишлист скопирована! Друзья увидят только подарки.");
      };

      const connectToRoom = () => {
        const cleanId = joinInput.includes("#room=") ? joinInput.split("#room=")[1].trim() : joinInput.trim();
        if (!cleanId) return;
        localStorage.setItem(currentFamilyMeta.roomKey, cleanId);
        setRoomId(cleanId);
        fetchFromCloud(cleanId, false);
        setJoinInput("");
        notify("Подключено к общей комнате семьи!");
      };

      // ============================================================================
      // ОТДЕЛЬНАЯ СТРАНИЦА ГОСТЕВОГО ВИШЛИСТА ДЛЯ ДРУЗЕЙ (пункт 9)
      // Друзья видят ТОЛЬКО подарки, без доступа к спискам, гардеробу и анкете семьи!
      // ============================================================================
      if (guestWishlistRoomId) {
        return (
          <div className="min-h-screen bg-[#F4F5F7] text-[#1F242D] px-4 py-8 max-w-xl mx-auto">
            {toast && (
              <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-[#1F242D] text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg">
                {toast}
              </div>
            )}

            <div className="aura-blue rounded-[30px] p-6 mb-6 border border-white shadow-xs">
              <div className="text-xs font-medium text-[#4080E6] mb-1">Is this your first? • Вишлист</div>
              <h1 className="text-2xl font-semibold tracking-tight">
                Подарки для {data.profile.babyName}
              </h1>
              <p className="text-xs text-[#5E6673] mt-1">
                Семья: {data.profile.momName} & {data.profile.partnerName} • Нажмите «Забронировать», чтобы другие гости знали, что подарок уже выбран.
              </p>
            </div>

            <div className="space-y-4">
              {data.wishlists.map(wl => (
                <div key={wl.id} className="space-y-2.5">
                  <h2 className="text-sm font-semibold px-1 text-[#47585C]">{wl.title}</h2>
                  {wl.items.map(it => {
                    const isFree = it.status === "Свободно";
                    return (
                      <div key={it.id} className="bg-white rounded-[24px] p-4 border border-[#E5E4E6] shadow-2xs">
                        <div className="flex items-start justify-between gap-3">
                          <div>
                            <div className="text-sm font-medium">{it.name}</div>
                            {it.price && <div className="text-xs text-[#4080E6] font-medium mt-0.5">{it.price}</div>}
                            {it.notes && <div className="text-xs text-[#6E7682] mt-1">{it.notes}</div>}
                            {it.link && it.link.startsWith("http") && (
                              <a href={it.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-xs text-[#4080E6] underline mt-1.5">
                                <Icon name="link" className="w-3.5 h-3.5" />
                                <span>Посмотреть в магазине</span>
                              </a>
                            )}
                          </div>

                          {isFree ? (
                            <button
                              onClick={() => setReservingWishId(it.id)}
                              className="px-4 py-2 rounded-full bg-[#4080E6] text-white text-xs font-medium shrink-0 active:scale-95 transition"
                            >
                              Забронировать
                            </button>
                          ) : (
                            <span className="px-3 py-1.5 rounded-full bg-[#E5E4E6] text-[#47585C] text-xs font-medium shrink-0">
                              {it.status} {it.reservedBy ? `(${it.reservedBy})` : ""}
                            </span>
                          )}
                        </div>

                        {reservingWishId === it.id && (
                          <div className="mt-3 pt-3 border-t border-[#F0F1F4] flex gap-2">
                            <input
                              type="text"
                              value={guestNameInput}
                              onChange={(e) => setGuestNameInput(e.target.value)}

                              className="flex-1 px-3 py-2 bg-[#F4F5F7] rounded-xl text-xs focus:outline-none"

                            <button
                              onClick={() => reserveWishlistItem(wl.id, it.id, guestNameInput)}

                            >
                              Подтвердить
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        );
      }

      // ============================================================================
      // ОСНОВНОЕ ПРИЛОЖЕНИЕ ДЛЯ СЕМЬИ
      // ============================================================================
      return (
        <div className="min-h-screen pb-28 max-w-2xl mx-auto px-4 pt-5">
          {toast && (

          {/* Шапка (пункт 5: название Is this your first?, пункт 6: кнопка Поделиться, пункт 7: кружки готовности) */}
          <header className="mb-5">
            <div className="flex items-center justify-between mb-4">

            {/* Заголовок экрана + кружки готовности (пункт 7 и 8) */}

              <div className="flex items-center gap-2 shrink-0">

                  <div className="aura-lavender px-3.5 py-2.5 rounded-[22px] border border-white flex items-center gap-2 shadow-2xs">

                {/* Отдельный кружок готовности гардероба на 1-й месяц (пункт 8) */}

                      <div className="text-[10px] text-[#5E6673]">1-й мес.</div>
                      <div className="text-lg font-semibold leading-none mt-0.5 text-[#1F242D]">

                {/* Главный кружок общей готовности (пункт 7) */}
                <div className="aura-blue px-4 py-2.5 rounded-[22px] border border-white flex items-center gap-2.5 shadow-2xs">
                  <div>
                    <div className="text-[10px] text-[#5E6673]">Общая</div>
                    <div className="text-xl font-semibold leading-none mt-0.5 text-[#1F242D]">
                      {overallReadiness}%
                    </div>
                  </div>
                  <div className="w-7 h-7 rounded-full grad-indigo shrink-0 opacity-90" />
                </div>
              </div>
            </div>
          </header>

          {/* ======================================================================== */}
          {/* 1. ВКЛАДКА СПИСКИ                                                        */}
          {/* ======================================================================== */}
          {activeTab === "checklist" && (
            <div className="space-y-4">
              {/* Пункт 1: Все иконки списков видны сразу (сетка 2-3 колонки без горизонтального скролла) с японскими градиентами IMG_9645 */}
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                {SECTION_TILES.map(tile => {
                  const isSelected = selectedSection === tile.id;
                  const count = tile.id === "Все"
                    ? data.checklist.filter(i => i.status !== "Куплено" && i.status !== "Сделано" && i.status !== "Не нужно").length
                    : data.checklist.filter(i => i.section === tile.id && i.status !== "Куплено" && i.status !== "Сделано" && i.status !== "Не нужно").length;

                  return (
                    <button
                      key={tile.id}
                      onClick={() => setSelectedSection(tile.id)}
                      className={`${tile.grad} rounded-[24px] p-3.5 text-left transition relative overflow-hidden ${
                        isSelected ? "ring-2 ring-[#1F242D] scale-[0.99]" : "opacity-90 hover:opacity-100"
                      }`}
                    >
                      <div className="flex items-center justify-between mb-2">
                        <Icon name={tile.icon} className="w-5 h-5 opacity-85" />
                        <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white/35 backdrop-blur-xs">
                          {count}
                        </span>
                      </div>
                      <div className="text-[13px] font-semibold leading-tight">{tile.label}</div>
                      <div className="text-[10px] opacity-75 mt-0.5">{tile.sub}</div>
                    </button>
                  );
                })}
              </div>

              {/* Поиск + добавление */}
              <div className="flex gap-2">
                <div className="relative flex-1">
                  <Icon name="search" className="w-4 h-4 text-[#6E7682] absolute left-3.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Поиск по вещам и документам..."
                    className="w-full pl-10 pr-4 py-3 bg-white border border-[#E5E4E6] rounded-2xl text-xs focus:outline-none focus:border-[#4080E6]"
                  />
                </div>
                <button
                  onClick={() => setShowAddModal(true)}
                  className="w-11 h-11 rounded-2xl bg-[#4080E6] text-white flex items-center justify-center shrink-0 shadow-xs active:scale-95 transition"
                >
                  <Icon name="plus" className="w-5 h-5" />
                </button>
              </div>

              {/* Фильтры: Статус, Приоритет (пункт 3) и Ответственный */}
              <div className="space-y-2 text-[11px]">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <div className="flex gap-1 bg-white p-1 rounded-full border border-[#E5E4E6]">
                    {["Все", "Осталось", "Готово"].map(st => (
                      <button
                        key={st}
                        onClick={() => setFilterStatus(st)}
                        className={`px-3 py-1 rounded-full transition ${

                      </button>
                    ))}
                  </div>

                  <div className="flex gap-1 bg-white p-1 rounded-full border border-[#E5E4E6]">
                    {["Все", data.profile.momName || "Ада", data.profile.partnerName || "Давид"].map(who => (
                      <button
                        key={who}
                        onClick={() => setFilterWho(who)}
                        className={`px-3 py-1 rounded-full transition ${
                          filterWho === who ? "bg-[#47585C] text-white font-medium" : "text-[#6E7682]"
                        }`}

                {/* Фильтр по 3 приоритетам (пункт 3) */}
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar">

                      key={pr}
                      onClick={() => setFilterPriority(pr)}
                      className={`px-3 py-1.5 rounded-full border transition whitespace-nowrap ${
                        filterPriority === pr
                          ? "bg-[#1F242D] text-white border-[#1F242D] font-medium"

                    >

                {filteredChecklist.map(item => {

                    item.importance === "Важно"
                      ? "bg-[#4080E6]/12 text-[#2B62BD]"
                      : item.importance === "Нужно после родов"

                  return (

                      className={`rounded-[24px] p-4 border transition ${

                    >
                      <div className="flex items-start justify-between gap-3">
                        {/* Клик по основной области раскрывает редактирование */}
                        <div

                        >

                        {/* Свитч выполнения в стиле IMG_9646 */}
                        <button

                      {/* Раскрытая панель редактирования заголовка, приоритета, комментариев и ссылки (пункт 3) */}
                      {isExpanded && (
                        <div className="mt-3.5 pt-3.5 border-t border-[#F0F1F4] space-y-2.5 text-xs">

                            <input

                  <select
                    value={newItem.importance}
                    onChange={(e) => setNewItem({ ...newItem, importance: e.target.value })}
                    className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                  >
                    {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                  <input
                    type="text"
                    value={newItem.who}
                    onChange={(e) => setNewItem({ ...newItem, who: e.target.value })}
                    placeholder="Кто"
                    className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                  />
                </div>
                <input
                  type="text"
                  value={newItem.notes}
                  onChange={(e) => setNewItem({ ...newItem, notes: e.target.value })}
                  placeholder="Комментарий..."
                  className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                />
                <button type="submit" className="w-full py-3 bg-[#4080E6] text-white rounded-2xl text-xs font-semibold">
                  Сохранить
                </button>
              </form>
            </div>
          )}

          {/* МОДАЛКА ДОБАВЛЕНИЯ КАТЕГОРИИ В ГАРДЕРОБ (пункт 8) */}
          {showAddWardrobeModal && (
            <div className="fixed inset-0 bg-black/25 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={handleAddWardrobeCategory} className="bg-white w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold">Новая категория одежды</h3>
                  <button type="button" onClick={() => setShowAddWardrobeModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <input
                  type="text"
                  required
                  value={newWardrobeName}
                  onChange={(e) => setNewWardrobeName(e.target.value)}
                  placeholder="Например: Песочники / Муслиновые боди..."
                  className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                />
                <select
                  value={newWardrobeSeason}
                  onChange={(e) => setNewWardrobeSeason(e.target.value)}
                  className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                >
                  <option value="all">Всесезонная одежда (нужна круглый год)</option>
                  <option value="cold">Только для холодного сезона (не нужна летом)</option>
                  <option value="warm">Только для теплого сезона (не нужна зимой)</option>
                </select>
                <button type="submit" className="w-full py-3 bg-[#4080E6] text-white rounded-2xl text-xs font-semibold">
                  Добавить в таблицу
                </button>
              </form>
            </div>
          )}

          {/* МОДАЛКА СОЗДАНИЯ НОВОЙ СЕМЬИ С НУЛЯ (пункт 11) */}
          {showNewFamilyModal && (
            <div className="fixed inset-0 bg-black/25 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={createFreshFamilyAccount} className="bg-white w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold">Новая семья с нуля</h3>
                  <button type="button" onClick={() => setShowNewFamilyModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <p className="text-xs text-[#6E7682]">
                  Будет создан новый чистый профиль с 0% готовности. Вы сможете вернуться в аккаунт «Ада & Давид» в любой момент.
                </p>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    required
                    value={newFamForm.momName}
                    onChange={(e) => setNewFamForm({ ...newFamForm, momName: e.target.value })}
                    placeholder="Имя мамы *"
                    className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                  />
                  <input
                    type="text"
                    value={newFamForm.partnerName}
                    onChange={(e) => setNewFamForm({ ...newFamForm, partnerName: e.target.value })}
                    placeholder="Имя партнёра"
                    className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    value={newFamForm.babyName}
                    onChange={(e) => setNewFamForm({ ...newFamForm, babyName: e.target.value })}
                    placeholder="Имя малыша"
                    className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                  />
                  <input
                    type="date"
                    value={newFamForm.dueDate}
                    onChange={(e) => setNewFamForm({ ...newFamForm, dueDate: e.target.value })}
                    className="w-full px-3.5 py-2.5 bg-[#F4F5F7] rounded-2xl text-xs"
                  />
                </div>
                <button type="submit" className="w-full py-3 bg-[#4080E6] text-white rounded-2xl text-xs font-semibold">
                  Начать подготовку с нуля
                </button>
              </form>
            </div>
          )}

          {/* Нижняя панель навигации в стиле IMG_9646 & IMG_9647 (белая капсула + индиго акцент) */}
          <nav className="fixed bottom-4 inset-x-4 max-w-md mx-auto pill-track rounded-full p-1.5 z-40">
            <div className="grid grid-cols-4 gap-1">
              {[
                { id: "checklist", label: "Списки", icon: "checkCircle" },
                { id: "wardrobe", label: "Гардероб", icon: "shirt" },
                { id: "wishlists", label: "Вишлист", icon: "gift" },
                { id: "profile", label: "Семья", icon: "user" }
              ].map(tab => {
                const active = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center py-2 rounded-full transition ${
                      active ? "bg-[#4080E6] text-white font-medium shadow-xs" : "text-[#6E7682]"
                    }`}
                  >
                    <Icon name={tab.icon} className="w-4 h-4 mb-0.5" />
                    <span className="text-[10px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
