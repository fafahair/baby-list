    function translateMedicalTextToEn(val) {
      if (!val || !val.trim()) return "Not specified";
      let out = val.trim();
      Object.entries(MED_TRANSLATIONS).forEach(([ru, en]) => {

        else if (out.includes(ru) && !out.includes(en)) out = out.replace(ru, en);

      out = out

    function detectClimateAndRegion(country = "", city = "") {
      const text = `${country} ${city}`.toLowerCase();

      const coldKeywords = ["росси", "russia", "москв", "питер", "санкт", "новосиб", "екатерин", "казан", "канад", "canada", "торонт", "монреал", "норвег", "norway", "швец", "sweden", "финлянд", "finland", "казахст", "беларус", "исланд", "эстон", "латв", "литв"];
      const southernHemisphere = ["австрал", "australia", "сидней", "мельбурн", "новая зеланд", "new zealand", "аргентин", "чили", "бразил", "юар"];

      let climate = "temperate";
      if (warmKeywords.some(k => text.includes(k))) climate = "warm";
      else if (coldKeywords.some(k => text.includes(k))) climate = "cold";

      let docProfile = "intl";
      if (text.includes("швейцар") || text.includes("switzerland") || text.includes("цюрих") || text.includes("zurich") || text.includes("женев") || text.includes("базел") || text.includes("берн") || text.includes("лозан")) {
        docProfile = "ch";
      } else if (text.includes("герман") || text.includes("germany") || text.includes("берлин") || text.includes("мюнхен") || text.includes("австр") || text.includes("austria") || text.includes("вена")) {
        docProfile = "de";
      } else if (text.includes("росси") || text.includes("russia") || text.includes("москв") || text.includes("санкт") || text.includes("питер")) {
        docProfile = "ru";
      }

      const isSouth = southernHemisphere.some(k => text.includes(k));
      return { climate, docProfile, isSouth };
    }

    function getSeasonInfo(dateStr, country = "", city = "") {
      const { climate, isSouth } = detectClimateAndRegion(country, city);
      if (!dateStr) return { name: "Зима", code: "winter", climate };
      let month = new Date(dateStr).getMonth() + 1;
      if (isSouth) month = ((month + 5) % 12) + 1;
      if (month === 12 || month === 1 || month === 2) return { name: "Зима", code: "winter", climate };
      if (month >= 3 && month <= 5) return { name: "Весна", code: "spring", climate };
      if (month >= 6 && month <= 8) return { name: "Лето", code: "summer", climate };
      return { name: "Осень", code: "autumn", climate };
    }

    function getSizeSeasonMeta(dueDateStr, size, country = "", city = "") {
      const { climate, isSouth } = detectClimateAndRegion(country, city);
      const offsets = { "50": 0, "56": 0, "62": 2, "68": 4, "74": 7, "80": 10 };
      const monthsAhead = offsets[size] || 0;
      const d = dueDateStr ? new Date(dueDateStr) : new Date("2026-12-15");
      d.setMonth(d.getMonth() + monthsAhead);
      let m = d.getMonth() + 1;
      if (isSouth) m = ((m + 5) % 12) + 1;

      let label = "Осень";
      let code = "autumn";
      if (m === 12 || m === 1 || m === 2) { label = "Зима"; code = "winter"; }
      else if (m >= 3 && m <= 5) { label = "Весна"; code = "spring"; }
      else if (m >= 6 && m <= 8) { label = "Лето"; code = "summer"; }

      const isDistantFuture = monthsAhead >= 6;
      return { label, code, climate, isDistantFuture, monthsAhead };
    }

    function estimateBirthSize(profile) {
      const week = Number(profile.ultrasoundWeek) || 32;
      const weight = Number(profile.ultrasoundWeightGrams) || 1950;
      const momH = Number(profile.momHeightCm) || 168;
      const dadH = Number(profile.dadHeightCm) || 180;
      const gender = profile.babyGender || "unknown";

      const weeksLeft = Math.max(0, 40 - week);
      let estBirthWeight = weight + weeksLeft * 195;

      const midParentHeight = (momH + dadH) / 2;
      const heightFactor = (midParentHeight - 172) * 12;
      const genderFactor = gender === "boy" ? 80 : gender === "girl" ? -70 : 0;
      estBirthWeight = Math.round(estBirthWeight + heightFactor + genderFactor);

      const estLength = Math.round(48 + (estBirthWeight - 3000) / 220 + (midParentHeight - 172) * 0.12);
      const recommendedSize = estLength <= 51 && estBirthWeight < 3200 ? "50" : estLength >= 55 || estBirthWeight > 4100 ? "62" : "56";

      return { estBirthWeight, estLength, recommendedSize };
    }

          <div className="text-[10px] text-[#75756E] leading-tight">{label}</div>
          <div className="text-xl font-normal tracking-tight leading-none mt-0.5 text-[#1C1C1A]">
            {pct}<span className="text-xs align-top ml-0.5">%</span>
          </div>
        </div>
        <div className="w-7 h-7 rounded-full yellow-bright shrink-0" />
      </div>
    );

    function App() {
      const hashParams = useMemo(() => parseHashParams(), []);
      const [guestWishlistRoomId] = useState(() => hashParams.wishlist || "");

      const [fbUrl, setFbUrl] = useState(() => {
        if (hashParams.fb) {
          const clean = normalizeFbUrl(hashParams.fb);
          localStorage.setItem("iyf_firebase_url", clean);
          return clean;
        }
        return localStorage.getItem("iyf_firebase_url") || "";
      });
      const [fbUrlInput, setFbUrlInput] = useState(() => localStorage.getItem("iyf_firebase_url") || "");

      const [familiesIndex, setFamiliesIndex] = useState(() => {
        try {
          const idx = localStorage.getItem("iyf_families_v1");
          return idx ? JSON.parse(idx) : [{ id: "ada_david", label: "Ада & Давид", storageKey: "iyf_data_ada_david", roomKey: "iyf_room_fb_ada_david" }];
        } catch (e) {
          return [{ id: "ada_david", label: "Ада & Давид", storageKey: "iyf_data_ada_david", roomKey: "iyf_room_fb_ada_david" }];
        }
      });

      const [currentFamilyId, setCurrentFamilyId] = useState(() => {
        return localStorage.getItem("iyf_active_family") || "ada_david";
      });

      const currentFamilyMeta = useMemo(() => {
        const found = familiesIndex.find(f => f.id === currentFamilyId) || familiesIndex[0];
        return { ...found, roomKey: "iyf_room_fb_" + found.id };
      }, [familiesIndex, currentFamilyId]);

      const [activeTab, setActiveTab] = useState("checklist");
      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(currentFamilyMeta.storageKey);
          if (saved) {
            const parsed = JSON.parse(saved);
            let mergedChecklist = parsed.checklist || INITIAL_DATA.checklist;
            if (!parsed._v10ListsMerged) {
              const existIds = new Set(mergedChecklist.map(i => i.id));
              const toAdd = INITIAL_DATA.checklist.filter(i => !existIds.has(i.id));
              if (toAdd.length > 0) mergedChecklist = [...mergedChecklist, ...toAdd];
            }
            return {
              ...INITIAL_DATA,
              ...parsed,
              _v10ListsMerged: true,
              checklist: mergedChecklist,
              customSections: parsed.customSections || [],
              profile: {
                ...INITIAL_DATA.profile,
                ...(parsed.profile || {}),
                urgentContacts: { ...INITIAL_DATA.profile.urgentContacts, ...(parsed.profile?.urgentContacts || {}) },
                medicalCard: { ...INITIAL_DATA.profile.medicalCard, ...(parsed.profile?.medicalCard || {}) }
              }
            };
          }
          return { ...INITIAL_DATA, _v10ListsMerged: true };
        } catch (e) { return { ...INITIAL_DATA, _v10ListsMerged: true }; }
      });

      const [roomId, setRoomId] = useState(() => {
        if (hashParams.room) {
          localStorage.setItem(currentFamilyMeta.roomKey, hashParams.room);
          return hashParams.room;
        }
        const saved = localStorage.getItem(currentFamilyMeta.roomKey);
        if (saved) return saved;
        const generated = "fam_" + Math.random().toString(36).slice(2, 8);
        localStorage.setItem(currentFamilyMeta.roomKey, generated);
        return generated;
      });

      const [syncStatus, setSyncStatus] = useState("idle");
      const [lastSyncTime, setLastSyncTime] = useState("");
      const [joinInput, setJoinInput] = useState("");
      const [showCodeModal, setShowCodeModal] = useState(false);
      const [toast, setToast] = useState("");
      const [medLangEn, setMedLangEn] = useState(false);

      const dataRef = useRef(data);
      const roomIdRef = useRef(roomId);
      const fbUrlRef = useRef(fbUrl);
      const famMetaRef = useRef(currentFamilyMeta);
      const lastUpdatedRef = useRef(Number(localStorage.getItem(currentFamilyMeta.storageKey + "_ts") || 0));
      const dirtyRef = useRef(false);
      const pushTimerRef = useRef(null);
      const initializedRoomPullRef = useRef(false);

      useEffect(() => { dataRef.current = data; }, [data]);
      useEffect(() => { roomIdRef.current = roomId; }, [roomId]);
      useEffect(() => { fbUrlRef.current = fbUrl; }, [fbUrl]);
      useEffect(() => { famMetaRef.current = currentFamilyMeta; }, [currentFamilyMeta]);

      const notify = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(""), 3200);
      }, []);

      const formatNow = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      // Запись в Firebase Realtime Database (мгновенно, без CORS-ошибок и лимитов)
      const pushToCloud = useCallback(async (payload, explicitRoomId = null, explicitFbUrl = null) => {
        const baseFb = normalizeFbUrl(explicitFbUrl || fbUrlRef.current || localStorage.getItem("iyf_firebase_url") || "");
        const targetId = guestWishlistRoomId || explicitRoomId || roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
        if (!baseFb || !targetId) {
          setSyncStatus("local");
          return false;
        }
        setSyncStatus("syncing");
        try {
          const res = await fetch(`${baseFb}/rooms/${encodeURIComponent(targetId)}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          dirtyRef.current = false;
          setSyncStatus("synced");
          setLastSyncTime(formatNow());
          return true;
        } catch (err) {
          setSyncStatus("error");
          return false;
        }
      }, [guestWishlistRoomId]);

      // Чтение из Firebase Realtime Database (каждую 1 секунду!)
      const pullFromCloud = useCallback(async (targetId, forceApply = false, explicitFbUrl = null) => {
        const baseFb = normalizeFbUrl(explicitFbUrl || fbUrlRef.current || localStorage.getItem("iyf_firebase_url") || "");
        if (!baseFb || !targetId) return false;
        try {
          const res = await fetch(`${baseFb}/rooms/${encodeURIComponent(targetId)}.json`, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const remote = await res.json();
          if (remote && remote.checklist && remote.profile) {
            const remoteTs = Number(remote._updatedAt || 0);
            const shouldApply = forceApply || (!dirtyRef.current && remoteTs > lastUpdatedRef.current);
            if (shouldApply) {
              lastUpdatedRef.current = remoteTs || Date.now();
              const merged = {
                ...INITIAL_DATA,
                ...remote,
                profile: {
                  ...INITIAL_DATA.profile,
                  ...(remote.profile || {}),
                  urgentContacts: { ...INITIAL_DATA.profile.urgentContacts, ...(remote.profile?.urgentContacts || {}) },
                  medicalCard: { ...INITIAL_DATA.profile.medicalCard, ...(remote.profile?.medicalCard || {}) }
                }
              };
              dataRef.current = merged;
              setData(merged);
              if (!guestWishlistRoomId) {
                localStorage.setItem(famMetaRef.current.storageKey, JSON.stringify(merged));
                localStorage.setItem(famMetaRef.current.storageKey + "_ts", String(lastUpdatedRef.current));
              }
            }
            setSyncStatus("synced");
            setLastSyncTime(formatNow());
            return true;
          } else if (remote === null && !guestWishlistRoomId) {
            // Комната в Firebase еще пустая — заливаем туда текущие данные
            await pushToCloud({ ...dataRef.current, _updatedAt: lastUpdatedRef.current || Date.now() }, targetId, baseFb);
            return true;
          }
        } catch (err) {
          setSyncStatus("error");
        }
        return false;
      }, [guestWishlistRoomId, pushToCloud]);

      useEffect(() => {
        let cancelled = false;
        const startup = async () => {
          const baseFb = fbUrlRef.current || localStorage.getItem("iyf_firebase_url") || "";
          if (!baseFb) {
            setSyncStatus("local");
            return;
          }
          if (guestWishlistRoomId) {
            await pullFromCloud(guestWishlistRoomId, true, baseFb);
            return;
          }

          const activeRoom = roomIdRef.current || localStorage.getItem(currentFamilyMeta.roomKey) || "";
          if (activeRoom) {
            const cameFromInviteLink = Boolean(hashParams.room && !initializedRoomPullRef.current);
            initializedRoomPullRef.current = true;
            await pullFromCloud(activeRoom, cameFromInviteLink, baseFb);
          }
        };

        startup();

        const interval = setInterval(() => {
          if (cancelled) return;
          const baseFb = fbUrlRef.current || localStorage.getItem("iyf_firebase_url") || "";
          const activeId = guestWishlistRoomId || roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
          if (baseFb && activeId && !dirtyRef.current) {
            pullFromCloud(activeId, false, baseFb);
          }
        }, 1000);

        return () => {
          cancelled = true;
          clearInterval(interval);
        };
      }, [currentFamilyMeta, guestWishlistRoomId, hashParams.room, fbUrl, pullFromCloud]);

      const persistData = useCallback((updater) => {
        setData(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          const now = Date.now();
          lastUpdatedRef.current = now;
          dirtyRef.current = true;
          const payload = { ...next, _updatedAt: now };
          dataRef.current = payload;

          if (!guestWishlistRoomId) {
            try {
              localStorage.setItem(famMetaRef.current.storageKey, JSON.stringify(payload));
              localStorage.setItem(famMetaRef.current.storageKey + "_ts", String(now));
            } catch (e) {}
          }

          if (fbUrlRef.current) {
            if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
            setSyncStatus("syncing");
            pushTimerRef.current = setTimeout(() => {
              pushToCloud(dataRef.current);
            }, 300);
          }

          return payload;
        });
      }, [guestWishlistRoomId, pushToCloud]);

      const handleManualSync = async () => {
        if (!fbUrlRef.current) {
          setShowCodeModal(true);
          notify("Подключите бесплатную базу Firebase в окне «Код»");
          return;
        }
        if (pushTimerRef.current) {
          clearTimeout(pushTimerRef.current);
          pushTimerRef.current = null;
        }
        const activeId = roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
        const ok = dirtyRef.current
          ? await pushToCloud({ ...dataRef.current, _updatedAt: Date.now() }, activeId)
          : await pullFromCloud(activeId, false);
        notify(ok ? "Синхронизировано!" : "Проверьте ссылку Firebase и правила доступа (read/write: true)");
      };

      const saveFirebaseUrl = async () => {
        const clean = normalizeFbUrl(fbUrlInput);
        if (!clean || (!clean.includes("firebaseio.com") && !clean.includes("firebasedatabase.app"))) {
          notify("Вставьте ссылку вида https://...firebasedatabase.app");
          return;
        }
        localStorage.setItem("iyf_firebase_url", clean);
        fbUrlRef.current = clean;
        setFbUrl(clean);
        const ok = await pushToCloud({ ...dataRef.current, _updatedAt: Date.now() }, roomIdRef.current, clean);
        notify(ok ? "Облако подключено! Синхронизация работает каждую 1 сек." : "Не удалось подключиться — проверьте правила в Firebase");
      };

      const switchFamilyAccount = async (famId) => {
        const target = familiesIndex.find(f => f.id === famId);
        if (!target) return;
        if (dirtyRef.current && roomIdRef.current) {
          await pushToCloud(dataRef.current, roomIdRef.current);
        }
        dirtyRef.current = false;
        setCurrentFamilyId(famId);
        localStorage.setItem("iyf_active_family", famId);
        try {
          const raw = localStorage.getItem(target.storageKey);
          const parsed = raw ? JSON.parse(raw) : INITIAL_DATA;
          setData(parsed);
          dataRef.current = parsed;
          lastUpdatedRef.current = Number(localStorage.getItem(target.storageKey + "_ts") || parsed._updatedAt || 0);
        } catch (e) {
          setData(INITIAL_DATA);
          dataRef.current = INITIAL_DATA;
        }
        const rKey = "iyf_room_fb_" + target.id;
        const targetRoom = localStorage.getItem(rKey) || ("fam_" + Math.random().toString(36).slice(2, 8));
        localStorage.setItem(rKey, targetRoom);
        roomIdRef.current = targetRoom;
        setRoomId(targetRoom);
        if (fbUrlRef.current) pullFromCloud(targetRoom, false);
        notify(`Профиль: ${target.label}`);
      };

      const [showOnboardingScreen, setShowOnboardingScreen] = useState(() => Boolean(hashParams.isNew));
      const [newFamForm, setNewFamForm] = useState({
        momName: "", dueDate: "2027-06-15", country: "Швейцария", city: "Цюрих", momHeightCm: "168"
      });

      const createFreshFamilyAccount = async (e) => {
        e.preventDefault();
        if (!newFamForm.momName.trim()) return;
        const newId = "fam_" + Date.now();
        const label = `${newFamForm.momName.trim()} (${newFamForm.city.trim() || newFamForm.country.trim()})`;
        const newMeta = { id: newId, label, storageKey: "iyf_data_" + newId, roomKey: "iyf_room_fb_" + newId };

        const freshData = buildPersonalizedStarterData(newFamForm);
        const now = Date.now();
        freshData._updatedAt = now;
        freshData._v10ListsMerged = true;
        freshData.customSections = [];

        // Новая семья полностью изолирована: не видит другие семьи!
        const isolatedIndex = [newMeta];
        setFamiliesIndex(isolatedIndex);
        localStorage.setItem("iyf_families_v1", JSON.stringify(isolatedIndex));
        localStorage.setItem(newMeta.storageKey, JSON.stringify(freshData));
        localStorage.setItem(newMeta.storageKey + "_ts", String(now));

        const newRoom = "fam_" + Math.random().toString(36).slice(2, 8);
        localStorage.setItem(newMeta.roomKey, newRoom);

        setCurrentFamilyId(newId);
        localStorage.setItem("iyf_active_family", newId);
        famMetaRef.current = newMeta;
        lastUpdatedRef.current = now;
        dirtyRef.current = false;
        setData(freshData);
        dataRef.current = freshData;
        roomIdRef.current = newRoom;
        setRoomId(newRoom);
        setShowOnboardingScreen(false);
        setActiveTab("checklist");
        window.history.replaceState(null, "", window.location.pathname);

        if (fbUrlRef.current) await pushToCloud(freshData, newRoom);
        notify(`Создан профиль: ${label}`);
      };

      const [selectedSection, setSelectedSection] = useState("Все");
      const [filterWho, setFilterWho] = useState("Все");
      const [filterStatus, setFilterStatus] = useState("Все");
      const [filterPriority, setFilterPriority] = useState("Все");
      const [searchQuery, setSearchQuery] = useState("");
      const [expandedItemId, setExpandedItemId] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [showAddListModal, setShowAddListModal] = useState(false);
      const [newListName, setNewListName] = useState("");

      const [editingSectionId, setEditingSectionId] = useState(null);
      const [editSectionName, setEditSectionName] = useState("");
      const [confirmDeleteSection, setConfirmDeleteSection] = useState(false);

      const allSectionTiles = useMemo(() => {
        const hidden = new Set(data.hiddenSections || []);
        const renames = data.sectionRenames || {};
        const base = SECTION_TILES
          .filter(t => t.id === "Все" || !hidden.has(t.id))
          .map(t => t.id === "Все" ? t : { ...t, label: renames[t.id] || t.label });
        const custom = (data.customSections || [])
          .filter(name => !hidden.has(name))
          .map(name => ({ id: name, label: renames[name] || name, isCustom: true }));
        return [...base, ...custom];
      }, [data.customSections, data.hiddenSections, data.sectionRenames]);

      const getSectionLabel = useCallback((secId) => {
        const found = allSectionTiles.find(t => t.id === secId);
        if (found) return found.label;
        return (data.sectionRenames && data.sectionRenames[secId]) || secId;
      }, [allSectionTiles, data.sectionRenames]);

      const openEditSectionModal = (secId) => {
        if (!secId || secId === "Все") return;
        setEditingSectionId(secId);
        setEditSectionName(getSectionLabel(secId));
        setConfirmDeleteSection(false);
      };

      const handleRenameSection = (e) => {
        e.preventDefault();
        const trimmed = editSectionName.trim();
        if (!trimmed || !editingSectionId) return;
        if (allSectionTiles.some(t => t.id !== editingSectionId && t.label.toLowerCase() === trimmed.toLowerCase())) {
          notify("Список с таким названием уже есть");
          return;
        }
        persistData(prev => ({
          ...prev,
          sectionRenames: { ...(prev.sectionRenames || {}), [editingSectionId]: trimmed }
        }));
        setEditingSectionId(null);
        notify(`Переименовано в «${trimmed}»`);
      };

      const handleDeleteSection = () => {
        if (!editingSectionId) return;
        const targetId = editingSectionId;
        const targetLabel = getSectionLabel(targetId);
        const isDefault = SECTION_TILES.some(t => t.id === targetId);
        const remaining = allSectionTiles.filter(t => t.id !== "Все" && t.id !== targetId);

        persistData(prev => {
          const nextRenames = { ...(prev.sectionRenames || {}) };
          delete nextRenames[targetId];
          return {
            ...prev,
            customSections: (prev.customSections || []).filter(s => s !== targetId),
            hiddenSections: isDefault
              ? Array.from(new Set([...(prev.hiddenSections || []), targetId]))
              : (prev.hiddenSections || []),
            sectionRenames: nextRenames,
            checklist: (prev.checklist || []).filter(item => item.section !== targetId)
          };
        });

        if (selectedSection === targetId) setSelectedSection("Все");
        if (newItem.section === targetId && remaining.length > 0) {
          setNewItem(prev => ({ ...prev, section: remaining[0].id }));
        }
        setEditingSectionId(null);
        setConfirmDeleteSection(false);
        notify(`Список «${targetLabel}» удалён`);
      };

      const handleAddNewList = (e) => {
        e.preventDefault();
        const trimmed = newListName.trim();
        if (!trimmed) return;
        if (allSectionTiles.some(t => t.id.toLowerCase() === trimmed.toLowerCase() || t.label.toLowerCase() === trimmed.toLowerCase())) {
          notify("Список с таким названием уже есть");
          return;
        }
        persistData(prev => ({
          ...prev,
          customSections: [...(prev.customSections || []), trimmed],
          hiddenSections: (prev.hiddenSections || []).filter(s => s !== trimmed)
        }));
        setSelectedSection(trimmed);
        setNewItem(prev => ({ ...prev, section: trimmed }));
        setNewListName("");
        setShowAddListModal(false);
        notify(`Создан список «${trimmed}»`);
      };

      const [newItem, setNewItem] = useState({
        section: "Малыш: уход", category: "Покупки", name: "", importance: "Важно",
        status: "В планах", who: data.profile.momName || "Ада", qty: "1 шт.", shop: "", notes: "", link: ""
      });

      const [showAddWardrobeModal, setShowAddWardrobeModal] = useState(false);
      const [newWardrobeName, setNewWardrobeName] = useState("");
      const [newWardrobeSeason, setNewWardrobeSeason] = useState("all");
      const [editingWardrobeId, setEditingWardrobeId] = useState(null);

      const [newWishName, setNewWishName] = useState("");
      const [newWishPrice, setNewWishPrice] = useState("");
      const [newWishShop, setNewWishShop] = useState("");
      const [newWishLink, setNewWishLink] = useState("");
      const [newWishNotes, setNewWishNotes] = useState("");
      const [guestNameInput, setGuestNameInput] = useState("");
      const [reservingWishId, setReservingWishId] = useState(null);
      const [expandedWishId, setExpandedWishId] = useState(null);

      const seasonInfo = useMemo(
        () => getSeasonInfo(data.profile.dueDate, data.profile.country, data.profile.city),
        [data.profile.dueDate, data.profile.country, data.profile.city]
      );
      const birthEstimate = useMemo(() => estimateBirthSize(data.profile), [data.profile]);

      const daysUntilDue = useMemo(() => {
        if (!data.profile.dueDate) return null;
        const diff = new Date(data.profile.dueDate) - new Date();
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
      }, [data.profile.dueDate]);

      const overallReadiness = useMemo(() => calcPriorityReadiness(data.checklist), [data.checklist]);

      const sectionReadiness = useMemo(() => {
        if (selectedSection === "Все") return null;
        return calcPriorityReadiness(data.checklist.filter(i => i.section === selectedSection));
      }, [data.checklist, selectedSection]);

      const getEffectiveNeed = useCallback((cell, sz) => {
        if (!cell) return 0;
        if (cell.customNeed) return Math.max(0, Number(cell.need) || 0);
        if (Number(sz) < Number(birthEstimate.recommendedSize)) return 0;
        return Math.max(0, Number(cell.need) || 0);
      }, [birthEstimate.recommendedSize]);

      const wardrobeFirstMonthReadiness = useMemo(() => {
        const firstMonthSizes = SIZES.filter(sz => Number(sz) <= Number(birthEstimate.recommendedSize));
        let totalNeeded = 0;
        let totalHave = 0;
        data.wardrobe.forEach(row => {
          if (row.seasonal === "cold" && (seasonInfo.code === "summer" || seasonInfo.climate === "warm")) return;
          if (row.seasonal === "warm" && seasonInfo.code === "winter" && seasonInfo.climate !== "warm") return;
          firstMonthSizes.forEach(sz => {
            const cell = row.sizes[sz];
            const effNeed = getEffectiveNeed(cell, sz);
            if (effNeed > 0) {
              totalNeeded += effNeed;
              totalHave += Math.min(cell.have, effNeed);
            }
          });
        });
        return totalNeeded === 0 ? 100 : Math.round((totalHave / totalNeeded) * 100);
      }, [data.wardrobe, birthEstimate.recommendedSize, seasonInfo, getEffectiveNeed]);

      const filteredChecklist = useMemo(() => {
        const filtered = data.checklist.filter(item => {
          if (selectedSection !== "Все" && item.section !== selectedSection) return false;
          if (filterWho !== "Все" && (item.who || "Общее") !== filterWho) return false;
          if (filterPriority !== "Все" && (item.importance || "Важно") !== filterPriority) return false;
          if (filterStatus === "Осталось" && (item.status === "Куплено" || item.status === "Сделано" || item.status === "Не нужно")) return false;
          if (filterStatus === "Готово" && item.status !== "Куплено" && item.status !== "Сделано") return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            if (!item.name.toLowerCase().includes(q) && !(item.notes || "").toLowerCase().includes(q)) return false;
          }
          return true;
        });

        return [...filtered].sort((a, b) => {
          const aDone = (a.status === "Куплено" || a.status === "Сделано") ? 1 : 0;
          const bDone = (b.status === "Куплено" || b.status === "Сделано") ? 1 : 0;
          if (aDone !== bDone) return aDone - bDone;
          const prioOrder = { "Важно": 0, "Нужно после родов": 1, "По желанию": 2 };
          return (prioOrder[a.importance] ?? 1) - (prioOrder[b.importance] ?? 1);
        });
      }, [data.checklist, selectedSection, filterWho, filterStatus, filterPriority, searchQuery]);

      const toggleItemDone = (id) => {
        persistData(prev => ({
          ...prev,
          checklist: prev.checklist.map(item => {
            if (item.id !== id) return item;
            const isDone = item.status === "Куплено" || item.status === "Сделано";
            const nextStatus = isDone ? "В планах" : (item.section === "Документы" || item.section === "Подготовить в доме" ? "Сделано" : "Куплено");
            return { ...item, status: nextStatus };
          })
        }));
      };

      const updateChecklistItemField = (id, field, value) => {
        persistData(prev => ({
          ...prev,
          checklist: prev.checklist.map(item => item.id === id ? { ...item, [field]: value } : item)
        }));
      };

      const deleteChecklistItem = (id) => {
        persistData(prev => ({ ...prev, checklist: prev.checklist.filter(item => item.id !== id) }));
        notify("Удалено");
      };

      const handleAddChecklistItem = (e) => {
        e.preventDefault();
        if (!newItem.name.trim()) return;
        persistData(prev => ({ ...prev, checklist: [{ ...newItem, id: "c_" + Date.now() }, ...prev.checklist] }));
        setNewItem({ ...newItem, name: "", shop: "", notes: "", link: "" });
        setShowAddModal(false);
        notify("Добавлено");
      };

      const sendChecklistItemToWishlist = (item) => {
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map((wl, idx) => idx !== 0 ? wl : {
            ...wl,
            items: [...wl.items, {
              id: "wi_" + Date.now(), name: item.name, price: "", shop: item.shop || "", link: item.link || "",
              status: "Свободно", reservedBy: "", notes: item.notes || "", sourceChecklistId: item.id
            }]
          })
        }));
        notify("Отправлено в вишлист для друзей");
      };

      const updateWardrobeCount = (rowId, size, field, delta) => {
        persistData(prev => ({
          ...prev,
          wardrobe: prev.wardrobe.map(row => {
            if (row.id !== rowId) return row;
            const current = row.sizes[size] || { have: 0, need: 0 };
            return {
              ...row,
              sizes: { ...row.sizes, [size]: { ...current, [field]: Math.max(0, current[field] + delta) } }
            };
          })
        }));
      };

      const renameWardrobeCategory = (rowId, newName) => {
        persistData(prev => ({
          ...prev,
          wardrobe: prev.wardrobe.map(row => row.id === rowId ? { ...row, category: newName } : row)
        }));
      };

      const handleAddWardrobeCategory = (e) => {
        e.preventDefault();
        if (!newWardrobeName.trim()) return;
        const defaultNeed = newWardrobeSeason === "all" ? 3 : 1;
        const newRow = {
          id: "w_" + Date.now(), category: newWardrobeName.trim(), seasonal: newWardrobeSeason,
          sizes: Object.fromEntries(SIZES.map(sz => [sz, { have: 0, need: defaultNeed }]))
        };
        persistData(prev => ({ ...prev, wardrobe: [...prev.wardrobe, newRow] }));
        setNewWardrobeName("");
        setShowAddWardrobeModal(false);
        notify("Категория добавлена");
      };

      const { monthShortages, twoSeasonShortages, futureShortages } = useMemo(() => {
        const month = [];
        const twoSeasons = [];
        const future = [];
        data.wardrobe.forEach(row => {
          SIZES.forEach(sz => {
            const meta = getSizeSeasonMeta(data.profile.dueDate, sz, data.profile.country, data.profile.city);
            if (row.seasonal === "cold" && (meta.code === "summer" || meta.climate === "warm")) return;
            if (row.seasonal === "warm" && meta.code === "winter" && meta.climate !== "warm") return;

            const cell = row.sizes[sz];
            const effNeed = getEffectiveNeed(cell, sz);
            if (cell && effNeed > cell.have) {
              const entry = {
                id: `${row.id}_${sz}`, rowId: row.id, category: row.category,
                size: sz, missing: effNeed - cell.have, season: meta.label
              };
              if (Number(sz) <= Number(birthEstimate.recommendedSize)) month.push(entry);
              else if (meta.isDistantFuture) future.push(entry);
              else twoSeasons.push(entry);
            }
          });
        });
        return { monthShortages: month, twoSeasonShortages: twoSeasons, futureShortages: future };
      }, [data.wardrobe, data.profile.dueDate, data.profile.country, data.profile.city, birthEstimate.recommendedSize, getEffectiveNeed]);

      const updateWardrobeNeed = (rowId, size, delta) => {
        persistData(prev => ({
          ...prev,
          wardrobe: prev.wardrobe.map(row => {
            if (row.id !== rowId) return row;
            const cur = row.sizes[size] || { have: 0, need: 0 };
            const baseNeed = getEffectiveNeed(cur, size);
            const nextNeed = Math.max(0, baseNeed + delta);
            return {
              ...row,
              sizes: { ...row.sizes, [size]: { ...cur, need: nextNeed, customNeed: true } }
            };
          })
        }));
      };

      const removeShortageNeed = (rowId, size) => {
        persistData(prev => ({
          ...prev,
          wardrobe: prev.wardrobe.map(row => {
            if (row.id !== rowId) return row;
            const cur = row.sizes[size] || { have: 0, need: 0 };
            return { ...row, sizes: { ...row.sizes, [size]: { ...cur, need: cur.have, customNeed: true } } };
          })
        }));
        notify("Количество необходимых вещей сокращено");
      };

      const sendShortageToWishlist = (item) => {
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map((wl, idx) => idx !== 0 ? wl : {
            ...wl,
            items: [...wl.items, {
              id: "wi_" + Date.now() + Math.random(),
              name: `${item.category} — р. ${item.size} (${item.missing} шт.)`,
              price: "", shop: "", link: "", status: "Свободно", reservedBy: "",
              notes: `Сезон: ${item.season}`, sourceWardrobe: { rowId: item.rowId, size: item.size }
            }]
          })
        }));
        notify(`Добавлено в вишлист: ${item.category}`);
      };

      const allWishlistItems = useMemo(() => {
        const list = [];
        (data.wishlists || []).forEach(wl => {
          (wl.items || []).forEach(it => {
            list.push({ ...it, _wlId: wl.id });
          });
        });
        return list;
      }, [data.wishlists]);

      const currencySymbol = useMemo(() => getCurrencyByCountry(data.profile.country), [data.profile.country]);

      const addWishlistItem = (e) => {
        e.preventDefault();
        if (!newWishName.trim()) return;
        const cleanNum = newWishPrice.toString().replace(/[^0-9.,]/g, "").trim();
        const formattedPrice = cleanNum ? `${cleanNum} ${currencySymbol}` : "";
        persistData(prev => {
          const targetList = prev.wishlists && prev.wishlists.length > 0
            ? prev.wishlists
            : [{ id: "wl1", title: "Общий вишлист", description: "", items: [] }];
          return {
            ...prev,
            wishlists: targetList.map((wl, idx) => idx !== 0 ? wl : {
              ...wl,
              items: [{
                id: "wi_" + Date.now(), name: newWishName.trim(), price: formattedPrice,
                shop: newWishShop.trim(), link: newWishLink.trim(), status: "Свободно", reservedBy: "", notes: newWishNotes.trim()
              }, ...wl.items]
            })
          };
        });
        setNewWishName("");
        setNewWishPrice("");
        setNewWishShop("");
        setNewWishLink("");
        setNewWishNotes("");
        notify("Подарок добавлен");
      };

      const shareAppForFriendsLink = () => {
        const baseUrl = window.location.href.split("#")[0];
        const link = `${baseUrl}#new`;
        shareUrlNativeOrCopy(
          link,
          "Is this your first? — Начать подготовку с нуля",
          "Ссылка для подруг скопирована! У них откроется чистый экран создания своей семьи."
        );
      };

      const updateWishlistItemField = (wlId, itemId, field, value) => {
        persistData(prev => ({
          ...prev,
          wishlists: prev.wishlists.map(wl => wl.id !== wlId ? wl : {
            ...wl,
            items: wl.items.map(it => it.id === itemId ? { ...it, [field]: value } : it)
          })
        }));
      };

      const reserveWishlistItem = (wlId, itemId, friendName) => {
        persistData(prev => {
          let targetWish = null;
          const updatedWishlists = prev.wishlists.map(wl => {
            if (wl.id !== wlId) return wl;
            return {
              ...wl,
              items: wl.items.map(it => {
                if (it.id !== itemId) return it;
                targetWish = it;
                return { ...it, status: "Забронировано", reservedBy: friendName || "Друг семьи" };
              })
            };
          });

          let updatedChecklist = prev.checklist;
          if (targetWish && targetWish.sourceChecklistId) {
            updatedChecklist = prev.checklist.map(c =>
              c.id === targetWish.sourceChecklistId ? { ...c, status: "Куплено" } : c
            );
          }

          let updatedWardrobe = prev.wardrobe;
          if (targetWish && targetWish.sourceWardrobe) {
            const { rowId, size } = targetWish.sourceWardrobe;
            updatedWardrobe = prev.wardrobe.map(row => {
              if (row.id !== rowId) return row;
              const cur = row.sizes[size] || { have: 0, need: 1 };
              return { ...row, sizes: { ...row.sizes, [size]: { ...cur, have: cur.have + 1 } } };
            });
          }

          return { ...prev, wishlists: updatedWishlists, checklist: updatedChecklist, wardrobe: updatedWardrobe };
        });
        setReservingWishId(null);
        setGuestNameInput("");
        notify("Подарок забронирован!");
      };

      const deleteWishlistItemOwner = (wlId, item) => {
        persistData(prev => {
          const updatedWishlists = prev.wishlists.map(wl =>
            wl.id === wlId ? { ...wl, items: wl.items.filter(it => it.id !== item.id) } : wl
          );

          let updatedChecklist = prev.checklist;
          if (item.sourceChecklistId) {
            updatedChecklist = prev.checklist.map(c =>
              c.id === item.sourceChecklistId ? { ...c, status: "В планах" } : c
            );
          }

          let updatedWardrobe = prev.wardrobe;
          if (item.sourceWardrobe && item.status !== "Свободно") {
            const { rowId, size } = item.sourceWardrobe;
            updatedWardrobe = prev.wardrobe.map(row => {
              if (row.id !== rowId) return row;
              const cur = row.sizes[size] || { have: 0, need: 1 };
              return { ...row, sizes: { ...row.sizes, [size]: { ...cur, have: Math.max(0, cur.have - 1) } } };
            });
          }

          return { ...prev, wishlists: updatedWishlists, checklist: updatedChecklist, wardrobe: updatedWardrobe };
        });
        notify("Удалено и возвращено в список покупок");
      };

      const shareUrlNativeOrCopy = async (url, title, copyMsg) => {
        if (navigator.share) {
          try {
            await navigator.share({ title, url });
            return;
          } catch (e) {}
        }
        try {
          await navigator.clipboard.writeText(url);
          notify(copyMsg);
        } catch (e) {
          notify("Ссылка: " + url);
        }
      };

      const shareFamilyLink = async () => {
        const activeId = roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
        const baseFb = fbUrlRef.current || localStorage.getItem("iyf_firebase_url") || "";
        if (!baseFb) {
          setShowCodeModal(true);
          notify("Сначала подключите Firebase в окне «Код», чтобы синхронизировать устройства");
          return;
        }
        await pushToCloud({ ...dataRef.current, _updatedAt: Date.now() }, activeId, baseFb);
        const baseUrl = window.location.href.split("#")[0];
        const link = `${baseUrl}#room=${encodeURIComponent(activeId)}&fb=${encodeURIComponent(baseFb)}`;
        shareUrlNativeOrCopy(
          link,
          `Is this your first? — ${data.profile.momName} & ${data.profile.partnerName}`,
          "Ссылка скопирована! Откройте её 1 раз на втором устройстве."
        );
      };

      const shareGuestWishlistLink = async () => {
        const activeId = roomIdRef.current || localStorage.getItem(famMetaRef.current.roomKey);
        const baseFb = fbUrlRef.current || localStorage.getItem("iyf_firebase_url") || "";
        if (!baseFb) {
          setShowCodeModal(true);
          notify("Сначала подключите Firebase в окне «Код»");
          return;
        }
        await pushToCloud({ ...dataRef.current, _updatedAt: Date.now() }, activeId, baseFb);
        const baseUrl = window.location.href.split("#")[0];
        const link = `${baseUrl}#wishlist=${encodeURIComponent(activeId)}&fb=${encodeURIComponent(baseFb)}`;
        shareUrlNativeOrCopy(
          link,
          "Варианты подарков",
          "Ссылка на вишлист для друзей скопирована!"
        );
      };

      const connectToRoom = async () => {
        const raw = joinInput.trim();
        if (!raw) return;
        let targetRoom = raw;
        let targetFb = fbUrlRef.current;

        if (raw.includes("#")) {
          const hashPart = raw.split("#")[1];
          const params = new URLSearchParams(hashPart);
          if (params.get("room")) targetRoom = params.get("room").trim();
          if (params.get("fb")) {
            targetFb = normalizeFbUrl(params.get("fb"));
            localStorage.setItem("iyf_firebase_url", targetFb);
            fbUrlRef.current = targetFb;
            setFbUrl(targetFb);
            setFbUrlInput(targetFb);
          }
        }

        if (!targetFb) {
          notify("Сначала вставьте ссылку Firebase выше или вставьте полную ссылку из «Поделиться»");
          return;
        }

        localStorage.setItem(famMetaRef.current.roomKey, targetRoom);
        roomIdRef.current = targetRoom;
        setRoomId(targetRoom);
        dirtyRef.current = false;
        const ok = await pullFromCloud(targetRoom, true, targetFb);
        setJoinInput("");
        if (ok) {
          setShowCodeModal(false);
          notify("Устройства связаны! Обновление каждую 1 сек.");
        } else {
          notify("Не удалось загрузить данные — проверьте код и ссылку Firebase.");
        }
      };

      // ========================================================================
      // ЧИСТЫЙ ЭКРАН СТАРТА НОВОЙ СЕМЬИ (по кнопке «Начать с нуля» или ссылке #new)
      // ========================================================================
      if (showOnboardingScreen) {
        return (
          <div className="app-shell min-h-screen flex items-center justify-center px-4 py-8">
            <form onSubmit={createFreshFamilyAccount} className="bg-[#F4F4F0] w-full max-w-md rounded-[28px] p-6 space-y-4">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <Icon name="dots" className="w-7 h-7 text-[#1C1C1A]" />
                  <span className="text-xs font-semibold text-[#1C1C1A]">Is this your first?</span>
                </div>
                {!hashParams.isNew && (
                  <button type="button" onClick={() => setShowOnboardingScreen(false)} className="text-xs text-[#75756E]">
                    Отмена
                  </button>
                )}
              </div>

              <div>
                <h1 className="text-2xl font-normal tracking-tight text-[#1C1C1A]">Начать подготовку</h1>
                <p className="text-xs text-[#75756E] mt-1 leading-relaxed">
                  Заполните данные о семье — мы подстроим сезон, документы, выписку и стартовый гардероб.
                </p>
              </div>

              <div className="grid grid-cols-2 gap-2.5 text-xs">
                <div className="min-w-0">
                  <label className="block text-[11px] text-[#75756E] mb-1">Имя мамы *</label>
                  <input
                    type="text"
                    required
                    value={newFamForm.momName}
                    onChange={(e) => setNewFamForm({ ...newFamForm, momName: e.target.value })}
                    placeholder="Анна"
                    className="uniform-input"
                  />
                </div>
                <div className="min-w-0">
                  <label className="block text-[11px] text-[#75756E] mb-1">ПДР *</label>
                  <input
                    type="date"
                    required
                    value={newFamForm.dueDate}
                    onChange={(e) => setNewFamForm({ ...newFamForm, dueDate: e.target.value })}
                    className="uniform-input"
                  />
                </div>
                <div className="min-w-0">
                  <label className="block text-[11px] text-[#75756E] mb-1">Страна *</label>
                  <input
                    type="text"
                    required
                    value={newFamForm.country}
                    onChange={(e) => setNewFamForm({ ...newFamForm, country: e.target.value })}
                    placeholder="Швейцария"
                    className="uniform-input"
                  />
                </div>
                <div className="min-w-0">
                  <label className="block text-[11px] text-[#75756E] mb-1">Город *</label>
                  <input
                    type="text"
                    required
                    value={newFamForm.city}
                    onChange={(e) => setNewFamForm({ ...newFamForm, city: e.target.value })}
                    placeholder="Цюрих"
                    className="uniform-input"
                  />
                </div>
                <div className="col-span-2 min-w-0">
                  <label className="block text-[11px] text-[#75756E] mb-1">Рост мамы (см) *</label>
                  <input
                    type="number"
                    required
                    min="140"
                    max="205"
                    value={newFamForm.momHeightCm}
                    onChange={(e) => setNewFamForm({ ...newFamForm, momHeightCm: e.target.value })}
                    placeholder="168"
                    className="uniform-input"
                  />
                </div>
              </div>

              <button type="submit" className="w-full py-3.5 yellow-bright rounded-2xl text-xs font-semibold">
                Начать с нуля
              </button>
            </form>
          </div>
        );
      }

      // ========================================================================
      // ГОСТЕВОЙ ВИШЛИСТ ДЛЯ ДРУЗЕЙ
      // ========================================================================
      if (guestWishlistRoomId) {
        return (
          <div className="app-shell max-w-xl mx-auto px-4 py-8">
            {toast && (
              <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-[#1C1C1A] text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg">
                {toast}
              </div>
            )}

            <div className="yellow-soft rounded-[28px] p-6 mb-5 space-y-2">
              <div className="text-xs font-medium text-[#75756E]">Is this your first?</div>
              <h1 className="text-2xl font-semibold tracking-tight">Варианты подарков</h1>
              {data.wishlistNote && (
                <p className="text-xs text-[#1C1C1A] bg-white/75 rounded-2xl p-3 leading-relaxed whitespace-pre-line">
                  {data.wishlistNote}
                </p>
              )}
              <p className="text-[11px] text-[#5C5C56]">
                Нажмите «Забронировать», чтобы другие гости знали, что подарок уже выбран.
              </p>
            </div>

            <div className="space-y-2.5">
              {allWishlistItems.map(it => {
                const isReserved = it.status === "Забронировано" || it.status === "Подарено";
                const linkHref = it.link && it.link.trim()
                  ? (it.link.trim().startsWith("http") ? it.link.trim() : "https://" + it.link.trim())
                  : "";
                return (
                  <div key={it.id} className={`widget-card-white p-4 transition ${isReserved ? "opacity-55" : "opacity-100"}`}>
                    <div className="flex items-start justify-between gap-3">
                      <div className="min-w-0 flex-1">
                        <div className="text-sm font-medium">{it.name}</div>
                        {(it.price || it.shop) && (
                          <div className="text-xs text-[#75756E] font-medium mt-0.5">
                            {[it.price, it.shop].filter(Boolean).join(" • ")}
                          </div>
                        )}
                        {it.notes && <div className="text-xs text-[#75756E] mt-1">{it.notes}</div>}
                        {linkHref && (
                          <a href={linkHref} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-xs font-medium underline mt-1.5 text-[#1C1C1A]">
                            <Icon name="link" className="w-3.5 h-3.5" />
                            <span>Открыть ссылку</span>
                          </a>
                        )}
                      </div>

                      {!isReserved ? (
                        <button
                          onClick={() => setReservingWishId(it.id)}
                          className="px-4 py-2 rounded-full yellow-bright text-xs font-semibold shrink-0 active:scale-95 transition"
                        >
                          Забронировать
                        </button>
                      ) : (
                        <span className="px-3 py-1.5 rounded-full bg-[#EAEAE3] text-[#5C5C56] text-xs font-medium shrink-0">
                          {it.status} {it.reservedBy ? `(${it.reservedBy})` : ""}
                        </span>
                      )}
                    </div>

                    {reservingWishId === it.id && (
                      <div className="mt-3 pt-3 flex gap-2">
                        <input
                          type="text"
                          value={guestNameInput}
                          onChange={(e) => setGuestNameInput(e.target.value)}
                          placeholder="Ваше имя (необязательно)..."
                          className="uniform-input !bg-[#F4F4F0] flex-1"
                        />
                        <button
                          onClick={() => reserveWishlistItem(it._wlId, it.id, guestNameInput)}
                          className="px-4 h-[42px] bg-[#1C1C1A] text-white rounded-2xl text-xs font-semibold shrink-0"
                        >
                          ОК
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ========================================================================
      // ОСНОВНОЕ ПРИЛОЖЕНИЕ ДЛЯ СЕМЬИ
      // ========================================================================
      const syncDotColor =
        syncStatus === "synced" ? "#4CAF50" :
        syncStatus === "syncing" ? "#FCE96A" :
        syncStatus === "error" ? "#E57373" : "#A8A8A0";

      const urgent = data.profile.urgentContacts || {};
      const med = data.profile.medicalCard || {};

      return (
        <div className="app-shell max-w-2xl mx-auto px-4 pt-5 pb-28">
          {toast && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-[#1C1C1A] text-[#F4F4F0] text-xs font-medium px-4 py-2.5 rounded-full shadow-lg text-center max-w-[90%]">
              {toast}
            </div>
          )}

          {/* Шапка */}
          <header className="mb-3">
            <div className="flex items-center justify-between gap-2 mb-3.5">
              <div className="flex items-center gap-2 min-w-0">
                <Icon name="dots" className="w-7 h-7 text-[#1C1C1A] shrink-0" />
                <div className="min-w-0">
                  <div className="text-xs font-semibold text-[#1C1C1A] tracking-tight truncate">Is this your first?</div>
                  <div className="text-[11px] text-[#75756E] truncate">
                    {data.profile.momName} & {data.profile.partnerName}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5 shrink-0">
                {/* Отдельная кнопка «Код семьи» всегда на виду */}
                <button
                  onClick={() => setShowCodeModal(true)}
                  className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-[#EAEAE3] text-[11px] font-medium text-[#1C1C1A] active:scale-95 transition"
                >
                  <Icon name="key" className="w-3.5 h-3.5 text-[#5C5C56]" />
                  <span>Код</span>
                </button>

                <button
                  onClick={handleManualSync}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#EAEAE3] text-[11px] font-medium text-[#1C1C1A] active:scale-95 transition"
                  title={lastSyncTime ? `Синхронизировано: ${lastSyncTime}` : "Синхронизировать"}
                >
                  <span style={{ backgroundColor: syncDotColor }} className={`w-2 h-2 rounded-full ${syncStatus === "syncing" ? "animate-pulse" : ""}`} />
                  <Icon name="sync" className={`w-3.5 h-3.5 text-[#5C5C56] ${syncStatus === "syncing" ? "animate-spin" : ""}`} />
                </button>

                <button
                  onClick={shareFamilyLink}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#EAEAE3] text-[11px] font-medium text-[#1C1C1A] active:scale-95 transition"
                >

                      type="date"
                      value={data.profile.dueDate}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, dueDate: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#75756E] mb-1">Страна</label>
                    <input
                      type="text"
                      value={data.profile.country}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, country: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                  <div className="min-w-0">
                    <label className="block text-[11px] text-[#75756E] mb-1">Город</label>
                    <input
                      type="text"
                      value={data.profile.city}
                      onChange={(e) => persistData(p => ({ ...p, profile: { ...p.profile, city: e.target.value } }))}
                      className="uniform-input"
                    />
                  </div>
                </div>
              </div>

              {/* Новая семья и ссылка для подруг (другие семьи скрыты) */}
              <div className="widget-card-white p-4 space-y-3 text-xs">
                <div className="text-sm font-semibold">Поделиться приложением</div>
                <p className="text-xs text-[#75756E] leading-relaxed">
                  Отправьте подругам ссылку — у них откроется чистый экран, где они смогут создать свою семью с нуля без доступа к вашим данным.
                </p>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={shareAppForFriendsLink}
                    className="py-2.5 px-3 rounded-2xl yellow-bright text-xs font-semibold flex items-center justify-center gap-1.5"
                  >
                    <Icon name="share" className="w-3.5 h-3.5" />
                    <span>Ссылка подругам</span>
                  </button>
                  <button
                    onClick={() => setShowOnboardingScreen(true)}
                    className="py-2.5 px-3 rounded-2xl bg-[#EAEAE3] text-[#1C1C1A] text-xs font-medium"
                  >
                    Начать с нуля
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛКА «КОД СЕМЬИ И СИНХРОНИЗАЦИЯ» (открывается по кнопке «Код» в шапке) */}
          {showCodeModal && (
            <div className="fixed inset-0 bg-black/25 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-[#F4F4F0] w-full max-w-md rounded-[28px] p-5 space-y-3.5 shadow-xl text-xs">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-medium">Облако и код семьи (1 сек)</h3>
                  <button type="button" onClick={() => setShowCodeModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>

                <div className="widget-card-white p-3.5 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="font-semibold text-[#1C1C1A]">1. Ваша база Firebase</span>
                    <span className="text-[11px] flex items-center gap-1.5">
                      <span style={{ backgroundColor: syncDotColor }} className="w-2 h-2 rounded-full" />
                      <span>{syncStatus === "synced" ? `Онлайн ${lastSyncTime}` : syncStatus === "syncing" ? "Синхр..." : "Не подключено"}</span>
                    </span>
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="url"
                      value={fbUrlInput}
                      onChange={(e) => setFbUrlInput(e.target.value)}
                      placeholder="https://...firebasedatabase.app"
                      className="uniform-input !bg-[#F4F4F0] flex-1"
                    />
                    <button onClick={saveFirebaseUrl} className="px-3.5 h-[42px] yellow-bright rounded-2xl text-xs font-semibold shrink-0">
                      Подключить
                    </button>
                  </div>
                </div>

                <div className="widget-card-white p-3.5 space-y-2">
                  <div className="text-[#75756E]">2. Ваш код семьи:</div>
                  <div className="flex items-center justify-between gap-2 bg-[#F4F4F0] px-3 py-2.5 rounded-2xl">
                    <code className="text-xs font-bold text-[#1C1C1A] break-all">{roomId}</code>
                    <button
                      onClick={() => { navigator.clipboard?.writeText(roomId); notify("Код семьи скопирован!"); }}
                      className="px-3 py-1.5 rounded-full yellow-soft text-[11px] font-semibold shrink-0"
                    >
                      Копировать
                    </button>
                  </div>
                </div>

                <div className="space-y-2">
                  <div className="text-[#75756E]">3. Подключить второе устройство (вставьте ссылку из «Поделиться» или код):</div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={joinInput}
                      onChange={(e) => setJoinInput(e.target.value)}
                      placeholder="Вставьте ссылку или код..."
                      className="uniform-input flex-1"
                    />
                    <button onClick={connectToRoom} className="px-4 h-[42px] bg-[#1C1C1A] text-white rounded-2xl text-xs font-medium shrink-0">
                      Войти
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛКА РЕДАКТИРОВАНИЯ / УДАЛЕНИЯ СПИСКА */}
          {editingSectionId && (
            <div className="fixed inset-0 bg-black/25 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={handleRenameSection} className="bg-[#F4F4F0] w-full max-w-md rounded-[28px] p-5 space-y-3.5 shadow-xl text-xs">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-medium">Настройка списка</h3>
                  <button type="button" onClick={() => setEditingSectionId(null)}><Icon name="x" className="w-5 h-5" /></button>
                </div>

                <div>
                  <label className="block text-[11px] text-[#75756E] mb-1">Название списка</label>
                  <input
                    type="text"
                    required
                    autoFocus
                    value={editSectionName}
                    onChange={(e) => setEditSectionName(e.target.value)}
                    placeholder="Название списка..."
                    className="uniform-input"
                  />
                </div>

                <button type="submit" className="w-full py-3 yellow-bright rounded-2xl text-xs font-semibold">
                  Сохранить название
                </button>

                <div className="pt-2">
                  {!confirmDeleteSection ? (
                    <button
                      type="button"
                      onClick={() => setConfirmDeleteSection(true)}
                      className="w-full py-2.5 rounded-2xl bg-white text-rose-600 font-medium flex items-center justify-center gap-1.5"
                    >
                      <Icon name="trash" className="w-3.5 h-3.5" />
                      <span>Удалить список</span>
                    </button>
                  ) : (
                    <div className="widget-card-white p-3.5 space-y-2.5">
                      <p className="text-xs text-[#1C1C1A] leading-relaxed">
                        Удалить список «{getSectionLabel(editingSectionId)}» и все его пункты ({data.checklist.filter(i => i.section === editingSectionId).length} шт.)?
                      </p>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          type="button"
                          onClick={() => setConfirmDeleteSection(false)}
                          className="py-2.5 rounded-2xl bg-[#EAEAE3] text-[#1C1C1A] font-medium"
                        >
                          Отмена
                        </button>
                        <button
                          type="button"
                          onClick={handleDeleteSection}
                          className="py-2.5 rounded-2xl bg-rose-600 text-white font-semibold"
                        >
                          Да, удалить
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </form>
            </div>
          )}

          {/* МОДАЛКА СОЗДАНИЯ НОВОГО СПИСКА */}
          {showAddListModal && (
            <div className="fixed inset-0 bg-black/25 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={handleAddNewList} className="bg-[#F4F4F0] w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-medium">Новый список</h3>
                  <button type="button" onClick={() => setShowAddListModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <input
                  type="text"
                  required
                  autoFocus
                  value={newListName}
                  onChange={(e) => setNewListName(e.target.value)}
                  placeholder="Например: Прогулки / Аптечка / Игрушки..."
                  className="uniform-input"
                />
                <button type="submit" className="w-full py-3 yellow-bright rounded-2xl text-xs font-semibold">
                  Создать список
                </button>
              </form>
            </div>
          )}

          {/* МОДАЛКА ДОБАВЛЕНИЯ В СПИСОК */}
          {showAddModal && (
            <div className="fixed inset-0 bg-black/25 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={handleAddChecklistItem} className="bg-[#F4F4F0] w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-medium">Новая задача / покупка</h3>
                  <button type="button" onClick={() => setShowAddModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <select
                  value={newItem.section}
                  onChange={(e) => setNewItem({ ...newItem, section: e.target.value })}
                  className="uniform-input"
                >
                  {allSectionTiles.filter(s => s.id !== "Все").map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
                <input
                  type="text"
                  required
                  value={newItem.name}
                  onChange={(e) => setNewItem({ ...newItem, name: e.target.value })}
                  placeholder="Название..."
                  className="uniform-input"
                />
                <div className="grid grid-cols-2 gap-2">
                  <select
                    value={newItem.importance}
                    onChange={(e) => setNewItem({ ...newItem, importance: e.target.value })}
                    className="uniform-input"
                  >
                    {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                  <input
                    type="text"
                    value={newItem.who}
                    onChange={(e) => setNewItem({ ...newItem, who: e.target.value })}
                    placeholder="Кто"
                    className="uniform-input"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    value={newItem.shop}
                    onChange={(e) => setNewItem({ ...newItem, shop: e.target.value })}
                    placeholder="Магазин (IKEA, Zara...)"
                    className="uniform-input"
                  />
                  <input
                    type="text"
                    value={newItem.link}
                    onChange={(e) => setNewItem({ ...newItem, link: e.target.value })}
                    placeholder="Ссылка на товар"
                    className="uniform-input"
                  />
                </div>
                <input
                  type="text"
                  value={newItem.notes}
                  onChange={(e) => setNewItem({ ...newItem, notes: e.target.value })}
                  placeholder="Комментарий..."
                  className="uniform-input"
                />
                <button type="submit" className="w-full py-3 yellow-bright rounded-2xl text-xs font-semibold">
                  Сохранить
                </button>
              </form>
            </div>
          )}

          {/* МОДАЛКА ДОБАВЛЕНИЯ КАТЕГОРИИ В ГАРДЕРОБ */}
          {showAddWardrobeModal && (
            <div className="fixed inset-0 bg-black/25 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <form onSubmit={handleAddWardrobeCategory} className="bg-[#F4F4F0] w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-medium">Новая категория одежды</h3>
                  <button type="button" onClick={() => setShowAddWardrobeModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <input
                  type="text"
                  required
                  value={newWardrobeName}
                  onChange={(e) => setNewWardrobeName(e.target.value)}
                  placeholder="Например: Песочники / Муслиновые боди..."
                  className="uniform-input"
                />
                <select
                  value={newWardrobeSeason}
                  onChange={(e) => setNewWardrobeSeason(e.target.value)}
                  className="uniform-input"
                >
                  <option value="all">Всесезонная одежда (нужна круглый год)</option>
                  <option value="cold">Только для холодного сезона (не нужна летом)</option>
                  <option value="warm">Только для тёплого сезона (не нужна зимой)</option>
                </select>
                <button type="submit" className="w-full py-3 yellow-bright rounded-2xl text-xs font-semibold">
                  Добавить в таблицу
                </button>
              </form>
            </div>
          )}

          {/* Светлая нижняя навигация без обводки */}
          <nav className="fixed bottom-4 inset-x-4 max-w-md mx-auto nav-pill-light rounded-full p-1.5 z-40">
            <div className="grid grid-cols-4 gap-1">
              {[
                { id: "checklist", label: "Списки", icon: "checkCircle" },
                { id: "wardrobe", label: "Гардероб", icon: "shirt" },
                { id: "wishlists", label: "Вишлист", icon: "gift" },
                { id: "profile", label: "Семья", icon: "user" }
              ].map(tab => {
                const active = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center py-2 rounded-full transition ${
                      active ? "yellow-bright font-semibold" : "text-[#75756E]"
                    }`}
                  >
                    <Icon name={tab.icon} className="w-4 h-4 mb-0.5" />
                    <span className="text-[10px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
