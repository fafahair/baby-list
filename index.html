      const month = new Date(dateStr).getMonth() + 1;
      if (month === 12 || month === 1 || month === 2) {
        return { name: "Зима", advice: "Нужен слой из мериноса/флиса, теплая шапочка на завязках и зимний конверт в автолюльку." };

        return { name: "Весна", advice: "Переменчивая погода: демисезонный комбинезон, хлопковые шапочки разной плотности и плед." };
      } else if (month >= 6 && month <= 8) {

      } else {
        return { name: "Осень", advice: "Многослойность: боди с длинным рукавом, флисовый комбинезон и защита от ветра." };

      d.setMonth(d.getMonth() + (offsets[size] || 0));
      const m = d.getMonth() + 1;
      if (m === 12 || m === 1 || m === 2) return "Зима";
      if (m >= 3 && m <= 5) return "Весна";
      if (m >= 6 && m <= 8) return "Лето";
      return "Осень";

          )}

          {/* МОДАЛКА ИМПОРТА ВИШЛИСТА */}
          {showImportModal && (
            <div className="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-[#F4F4F0] w-full max-w-md rounded-[28px] p-5 space-y-3 shadow-xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-medium">Импорт подарков</h3>
                  <button onClick={() => setShowImportModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <textarea
                  rows="4"
                  value={importText}
                  onChange={(e) => setImportText(e.target.value)}
                  placeholder={"Каждый подарок с новой строки..."}
                  className="w-full p-3.5 bg-white rounded-2xl text-xs"
                />
                <button onClick={handleImportWishlist} className="w-full py-3 bg-[#1C1C1A] text-white rounded-2xl text-xs font-medium">
                  Добавить в вишлист
                </button>
              </div>
            </div>
          )}

          {/* Нижняя панель навигации в стиле плавающей капсулы */}
          <nav className="fixed bottom-4 inset-x-4 max-w-md mx-auto bg-[#1C1C1A]/95 backdrop-blur-md text-white rounded-full p-1.5 shadow-xl z-40">
            <div className="grid grid-cols-4 gap-1">
              {[
                { id: "checklist", label: "Списки", icon: "checkCircle" },
                { id: "wardrobe", label: "Гардероб", icon: "shirt" },
                { id: "wishlists", label: "Вишлист", icon: "gift" },
                { id: "profile", label: "Семья", icon: "user" }
              ].map(tab => {
                const active = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center py-2 rounded-full transition ${
                      active ? "bg-[#FCE96A] text-[#1C1C1A] font-medium" : "text-white/60"
                    }`}
                  >
                    <Icon name={tab.icon} className="w-4 h-4 mb-0.5" />
                    <span className="text-[10px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
